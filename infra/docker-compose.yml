# =============================================================================
# H2Fleet — full local stack (middleware + platform services + observability)
#
# Profiles:
#   (default / middleware)  all middleware + observability + backup containers
#   apps                    + the 10 platform services (incl. telemetry-simulator) + PWA
#   all                     + apps + fluvio + etl helpers
#   fluvio                  optional edge streaming (alternative telemetry stream path)
#   etl                     one-shot lakehouse ETL runner
#   waf                     openappsec agent sidecar for APISIX (experimental)
#   ml                      MLflow tracking server (also in `all`; UI :5000 loopback)
#   graph                   optional Neo4j graph DB for ml-platform graph features
#   ray                     optional Ray cluster (head + worker) for distributed ML
#
# Secrets: every credential below uses ${VAR:-dev-default} interpolation.
# Copy .env.example (repo root) to .env to override; the defaults are DEV ONLY.
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d                  # middleware only
#   docker compose -f infra/docker-compose.yml --profile apps up -d   # middleware + services
#   docker compose -f infra/docker-compose.yml --profile all  up -d   # everything
# =============================================================================

name: h2fleet

networks:
  h2net:
    driver: bridge

volumes:
  pg_data:
  pg_temporal_data:
  redis_data:
  kafka_data:
  zk_data:
  opensearch_data:
  minio_data:
  tigerbeetle_data:
  keycloak_data:
  keycloak_realm:        # rendered (secret-substituted) Keycloak realm import
  prometheus_data:
  grafana_data:
  ml_artifacts:          # ml-platform MODEL_ARTIFACTS_DIR (/artifacts)
  neo4j_data:            # optional `graph` profile

x-h2-env: &h2-env
  DATABASE_URL: postgres://h2:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/h2fleet?sslmode=disable
  KAFKA_BROKERS: kafka:9092
  REDIS_ADDR: redis:6379
  TOGGLE_URL: http://toggle-service:8080
  KEYCLOAK_ISSUER: http://keycloak:8080/realms/h2fleet
  # JWT audience check (go-auth validates `aud` only when set): the
  # confidential `services` client id from the realm.
  KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-services}

services:

  # ---------------------------------------------------------------------------
  # Event backbone: ZooKeeper + Kafka
  # ---------------------------------------------------------------------------
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: h2-zookeeper
    networks: [h2net]
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - zk_data:/bitnami/zookeeper
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | timeout 2 nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 6

  kafka:
    image: bitnami/kafka:3.9.1
    container_name: h2-kafka
    networks: [h2net]
    ports:
      - "9094:9094"   # host access for local dev tooling
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
    volumes:
      - kafka_data:/bitnami/kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Fluvio — OPTIONAL edge telemetry streaming from bus gateways (profile: fluvio).
  # Documented edge bridge: in production bus gateways publish to a Fluvio
  # cluster at the edge and telemetry-ingest bridges Fluvio -> telemetry.raw.
  # This bridge is a documented design, not yet implemented; locally the
  # telemetry-simulator publishes straight to Kafka (profile: apps).
  # ---------------------------------------------------------------------------
  fluvio:
    image: infinyon/fluvio:0.11.11
    container_name: h2-fluvio
    profiles: ["fluvio", "all"]
    networks: [h2net]
    ports:
      - "9003:9003"   # SC
      - "9005:9005"   # SPU public
    command: ["fluvio-run", "start", "--local"]
    healthcheck:
      test: ["CMD-SHELL", "fluvio topic list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Temporal — dispatch / incident / settlement workflows (+ UI + its own PG)
  # ---------------------------------------------------------------------------
  postgres-temporal:
    image: postgres:16.10-alpine
    container_name: h2-postgres-temporal
    networks: [h2net]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    volumes:
      - pg_temporal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 6

  temporal:
    image: temporalio/auto-setup:1.29.6
    container_name: h2-temporal
    networks: [h2net]
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgres-temporal
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      ENABLE_ES: "false"
    depends_on:
      postgres-temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: h2-temporal-ui
    networks: [h2net]
    ports:
      - "127.0.0.1:8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    depends_on:
      temporal:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Main database: Postgres 16 + TimescaleDB (+ PostGIS via timescaledb-ha image)
  # timescale/timescaledb-ha ships postgis + timescaledb extensions preinstalled.
  # Bootstrap runs infra/sql/001_init.sql + 002_seed.sql on FIRST boot only;
  # forward schema changes go through the goose `migrator` one-shot below
  # (infra/sql/migrations). Both paths are idempotent.
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb-ha:pg16.10-ts2.22.1-all
    container_name: h2-postgres
    networks: [h2net]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: h2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}
      POSTGRES_DB: h2fleet
    volumes:
      - pg_data:/home/postgres/pgdata/data
      - ../infra/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ../infra/sql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U h2 -d h2fleet"]
      interval: 10s
      timeout: 5s
      retries: 8

  # ---------------------------------------------------------------------------
  # Goose migrator (one-shot). Applies infra/sql/migrations/*.sql (goose format)
  # and exits; all platform services depend_on its successful completion.
  # Image: ghcr.io/kukymbr/goose-docker (thin wrapper around pressly/goose).
  # ---------------------------------------------------------------------------
  migrator:
    image: ghcr.io/kukymbr/goose-docker:3.27.1
    container_name: h2-migrator
    networks: [h2net]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=postgres port=5432 user=h2 password=${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env} dbname=h2fleet sslmode=disable
      GOOSE_COMMAND: up
      GOOSE_VERBOSE: "true"
    volumes:
      - ../infra/sql/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # IAM: Keycloak. The realm template (infra/keycloak/realm-h2fleet.json) uses
  # ${VAR} placeholders for user passwords and the `services` client secret;
  # keycloak-realm-init renders it into the shared `keycloak_realm` volume with
  # sed before Keycloak imports it (--import-realm). See infra/keycloak/README
  # note in docs/SECRETS.md.
  # ---------------------------------------------------------------------------
  keycloak-realm-init:
    image: alpine:3.20
    container_name: h2-keycloak-realm-init
    networks: [h2net]
    environment:
      KEYCLOAK_SERVICES_CLIENT_SECRET: ${KEYCLOAK_SERVICES_CLIENT_SECRET:-h2fleet-services-secret-change-me}
      KEYCLOAK_ADMIN_USER_PASSWORD: ${KEYCLOAK_ADMIN_USER_PASSWORD:?set_in_.env}
      KEYCLOAK_OPERATOR_PASSWORD: ${KEYCLOAK_OPERATOR_PASSWORD:-operator123}
      KEYCLOAK_DRIVER_PASSWORD: ${KEYCLOAK_DRIVER_PASSWORD:-driver123}
      KEYCLOAK_CITIZEN_PASSWORD: ${KEYCLOAK_CITIZEN_PASSWORD:-citizen123}
    volumes:
      - ../infra/keycloak/realm-h2fleet.json:/template/realm-h2fleet.json:ro
      - ../infra/keycloak/substitute-realm.sh:/usr/local/bin/substitute-realm.sh:ro
      - keycloak_realm:/out
    entrypoint: ["/bin/sh", "/usr/local/bin/substitute-realm.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: h2-keycloak
    networks: [h2net]
    ports:
      - "8180:8080"   # primary (docs/tooling)
      - "8088:8080"   # matches the PWA build-time default VITE_KEYCLOAK_URL
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file                    # dev-file keeps it dependency-free; swap for postgres in prod
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    volumes:
      - keycloak_realm:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data/h2
    depends_on:
      keycloak-realm-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep 200"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ---------------------------------------------------------------------------
  # ReBAC: Permify, persisted to its own `permify` database on the main
  # Postgres (choice documented: we cannot edit infra/sql/001_init.sql from
  # this workstream, so permify-db-init creates the database idempotently
  # instead of relying on the init script; permify-migrate then applies
  # Permify's own schema migrations before `serve` starts).
  # Schema (authorization model) is loaded by permify-setup from
  # infra/permify/schema.perm.
  # ---------------------------------------------------------------------------
  permify-db-init:
    image: postgres:16.10-alpine
    container_name: h2-permify-db-init
    networks: [h2net]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}
    entrypoint: >
      sh -c "psql -h postgres -U h2 -d h2fleet -tc
             \"SELECT 1 FROM pg_database WHERE datname='permify'\" | grep -q 1
             || psql -h postgres -U h2 -d h2fleet -c 'CREATE DATABASE permify'"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  permify-migrate:
    image: ghcr.io/permify/permify:v1.2.4
    container_name: h2-permify-migrate
    networks: [h2net]
    command: ["migrate"]
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://h2:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/permify?sslmode=disable
    depends_on:
      permify-db-init:
        condition: service_completed_successfully
    restart: "no"

  permify:
    image: ghcr.io/permify/permify:v1.2.4
    container_name: h2-permify
    networks: [h2net]
    ports:
      - "127.0.0.1:3476:3476"   # gRPC (services use PERMIFY_GRPC=permify:3476)
      - "127.0.0.1:3478:3478"   # HTTP/REST
    command: ["serve"]
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://h2:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/permify?sslmode=disable
    depends_on:
      permify-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3478/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

  permify-setup:
    image: ghcr.io/permify/permify:v1.2.4
    container_name: h2-permify-setup
    networks: [h2net]
    volumes:
      - ../infra/permify/schema.perm:/schema.perm:ro
    entrypoint: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1 || true;
             sleep 2;
             curl -sf -X POST http://permify:3478/v1/tenants/t1/schemas
               -H 'Content-Type: application/json'
               -d '{\"schema\": '\"'$$(cat /schema.perm | sed 's/\"/\\\\\"/g' | sed 's/^/\\n/' | tr -d \"\n\")'\"'}'
             || echo 'schema write best-effort (use Permify UI/CLI to verify)'"
    depends_on:
      permify:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Redis — toggle cache, twin hot state, sessions, simulator bus:meta hashes
  # ---------------------------------------------------------------------------
  redis:
    # SECURITY: pinned to 7.4.6 (CVE-2025-49844/32023/48367/21605/2024-46981). Audit also
    # recommends ACL-disabling EVAL/EVALSHA for service users (redis config, owned separately).
    image: redis:7.4.6-alpine
    container_name: h2-redis
    networks: [h2net]
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ---------------------------------------------------------------------------
  # OpenSearch + Dashboards — open-data portal + telemetry search.
  # opensearch-bootstrap (one-shot) creates the indexes/mappings used by
  # citizen-api (OPENSEARCH_INDEX=h2fleet-open) and the open-data portal.
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.19.2
    container_name: h2-opensearch
    networks: [h2net]
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"   # dev only
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.2
    container_name: h2-opensearch-dashboards
    networks: [h2net]
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy

  # NOTE: the Dockerfile is delivered by a parallel workstream; profile-scoped
  # so plain `make up` (middleware) does not require it to exist yet.
  opensearch-bootstrap:
    build:
      context: ..
      dockerfile: services/python/opensearch-bootstrap/Dockerfile
    container_name: h2-opensearch-bootstrap
    profiles: ["apps", "all"]
    networks: [h2net]
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: h2fleet-open
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Gateway: APISIX in STANDALONE mode — routes are loaded directly from the
  # mounted infra/apisix/apisix.yaml (no etcd needed; config.yaml uses
  # ${{APISIX_ADMIN_KEY:=default}} env substitution, fed by APISIX_ADMIN_KEY).
  # Optional TLS: uncomment the 9443 port + cert mounts (see docs/GATEWAY.md).
  #
  # Security notes:
  #  * the admin API (:9180) is NOT published to the host — reach it
  #    in-network or via `docker exec h2-apisix curl localhost:9180/...`.
  #  * :9091 is the APISIX prometheus plugin endpoint (plugin enabled in
  #    infra/apisix/config.yaml); scraped by infra/observability/prometheus.yml.
  # OpenAppSec WAF: enable profile `waf` to attach the openappsec agent.
  # ---------------------------------------------------------------------------
  apisix:
    image: apache/apisix:3.17.0-debian
    container_name: h2-apisix
    networks: [h2net]
    ports:
      - "9080:9080"              # data plane (gateway entrypoint per SPEC §3.6)
      - "127.0.0.1:9091:9091"    # prometheus plugin metrics
      # - "9443:9443"            # optional TLS data plane (docs/GATEWAY.md)
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-h2fleet-admin-key-change-me}
      PWA_ORIGIN: http://localhost:3000   # CORS allow-origin for the PWA
    volumes:
      - ../infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      # TLS (optional): mount certs per docs/GATEWAY.md, e.g.
      # - ../infra/apisix/certs:/usr/local/apisix/conf/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9080/apisix/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # OpenAppSec nano-agent sidecar (profile: waf).
  # The agent attaches to APISIX via the openappsec APISIX plugin
  # (see infra/apisix/apisix.yaml `plugins: openappsec` note). For local dev the
  # WAF runs in learn/detect mode; enforcement is opt-in. Docs:
  # https://docs.openappsec.io/integrations/apisix
  openappsec-agent:
    image: ghcr.io/openappsec/agent:1.1.20
    container_name: h2-openappsec
    profiles: ["waf"]
    networks: [h2net]
    environment:
      # local dev: no cloud management token needed; agent runs standalone
      AGENT_TOKEN: ""
      LEARNING_MODE: "true"
    depends_on:
      apisix:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Mojaloop — fare payment rails.
  # A full Mojaloop switch is normally deployed to Kubernetes via the official
  # Helm charts: https://github.com/mojaloop/helm (mojaloop/mojaloop chart).
  # For local development we run the lightweight Mojaloop SIMULATOR
  # (mojaloop/simulator) which speaks FSPIOP-API (quotes/transfers/parties) and
  # is what commerce-api integrates against. mojaloop-transfer-ids stored in
  # commerce.fare_payments reference transfers simulated here.
  # ---------------------------------------------------------------------------
  mojaloop-simulator:
    image: mojaloop/simulator:v14.2.0
    container_name: h2-mojaloop-sim
    networks: [h2net]
    ports:
      - "8444:8444"   # FSPIOP API (simulated switch)
    environment:
      # scheme adapter style endpoints exposed for commerce-api
      DFSP_ID: h2fleet
      CACHE_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8444/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ---------------------------------------------------------------------------
  # TigerBeetle — double-entry financial ledger
  # Accounts: RIDER_WALLET=1xxx, OPERATOR_REVENUE=2xxx, ENERGY_TRADE=3xxx,
  #           CARBON_FUND=4xxx  (SPEC §3.4)
  # Backup: the `backup` service copies /data/0_0.tigerbeetle (crash-consistent
  # single-file snapshot) to MinIO — see docs/DR.md.
  # ---------------------------------------------------------------------------
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.13
    container_name: h2-tigerbeetle
    networks: [h2net]
    ports:
      - "3000:3000"
    command:
      - start
      - --addresses=0.0.0.0:3000
      - --development
      - /data/0_0.tigerbeetle
    volumes:
      - tigerbeetle_data:/data
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh -c 'exit 0'"]  # TB has no HTTP probe; format-on-start guarantees readiness via replica handshake
      interval: 15s
      timeout: 5s
      retries: 4

  # ---------------------------------------------------------------------------
  # Lakehouse: MinIO (object store) + Iceberg REST catalog (Tabulario image)
  # Analytics zone: iceberg tables under s3://h2-lakehouse/
  # ---------------------------------------------------------------------------
  minio:
    # SECURITY (CVE-2026-41145): audit 2026-07-25 recommends latest RELEASE.2026-xx, but no
    # verifiable upstream minio/minio 2026 tag exists (upstream image publishing stalled).
    # Track and bump at the integration gate; rotate default creds (audit F9) in the meantime.
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: h2-minio
    networks: [h2net]
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-h2admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-h2adminpass}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null && mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 8

  minio-init:
    # SECURITY: see minio note above — bump together with minio/minio when a verified tag lands.
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: h2-minio-init
    networks: [h2net]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-h2admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-h2adminpass}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb -p local/h2-lakehouse || true;
             mc mb -p local/h2-open-data || true;
             mc mb -p local/h2-backups || true;
             mc mb -p local/lakehouse || true"   # MLflow default-artifact-root s3://lakehouse/mlflow
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: h2-iceberg-rest
    networks: [h2net]
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-h2admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-h2adminpass}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://h2-lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 8

  # ---------------------------------------------------------------------------
  # Spark (bitnami) — master + worker. Apache Sedona geospatial jars are
  # installed by the lakehouse-etl image build (services/python/lakehouse-etl/Dockerfile
  # downloads org.apache.sedona:sedona-spark-shaded + geotools wrapper matching
  # Spark 3.5 / Scala 2.12 and registers spark.sql.extensions=
  # org.apache.sedona.sql.SedonaSqlExtensions). To run ad-hoc Sedona jobs
  # against this master, mount the same jars via spark-submit --packages
  # org.apache.sedona:sedona-spark-shaded-3.5_2.12:1.7.0.
  #
  # SECURITY (CVE-2025-55039): Spark's network crypto (spark.network.crypto.*)
  # uses AES/CTR with a reused keystream — enabling it WITHOUT the fix leaks
  # RPC plaintext. Spark 3.5.7 does not yet carry the upstream hardening, so
  # RPC encryption stays OFF here (SPARK_RPC_ENCRYPTION_ENABLED=no) and the
  # master submit/UI ports MUST stay internal to h2net (they are published to
  # the host below only for local dev). If RPC encryption is ever enabled,
  # the audit's recommended mitigation is:
  #   spark.network.crypto.enabled=true
  #   spark.network.crypto.cipher=AES/GCM/NoPadding
  # (plus spark.authenticate=true with a shared secret) — set via
  # spark-defaults.conf / SPARK_CONF_DIR, not invented ad-hoc here.
  # ---------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5.7
    container_name: h2-spark-master
    networks: [h2net]
    ports:
      - "8280:8080"   # master UI
      - "7077:7077"   # submit
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8

  spark-worker:
    image: bitnami/spark:3.5.7
    container_name: h2-spark-worker
    networks: [h2net]
    ports:
      - "8281:8081"   # worker UI
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: "1"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    depends_on:
      spark-master:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Observability: Prometheus + Alertmanager + Grafana.
  # Config: infra/observability/{prometheus.yml,alertmanager.yml,alerts.yml}
  # Grafana provisioning: infra/observability/grafana/**
  # NOTE: the per-service scrape jobs are pre-provisioned, but most services do
  # not expose /metrics yet (follow-up workstream) — until then those targets
  # simply show as DOWN in Prometheus.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: h2-prometheus
    networks: [h2net]
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: h2-alertmanager
    networks: [h2net]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:11.2.10
    container_name: h2-grafana
    networks: [h2net]
    ports:
      - "127.0.0.1:3001:3000"   # http://localhost:3001 (admin/admin, change on login)
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # Backup: scheduled pg_dump of BOTH postgres instances (h2fleet + temporal)
  # plus a crash-consistent TigerBeetle data-file snapshot, uploaded to MinIO
  # bucket h2-backups via mc. Loops every BACKUP_INTERVAL_SECONDS (default 24h);
  # run a one-off backup with `make backup`. Restore drill: docs/DR.md.
  # ---------------------------------------------------------------------------
  backup:
    build: ../infra/backup
    container_name: h2-backup
    networks: [h2net]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}
      TEMPORAL_POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-h2admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-h2adminpass}
      BACKUP_BUCKET: h2-backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - tigerbeetle_data:/tigerbeetle:ro
    depends_on:
      postgres: { condition: service_healthy }
      postgres-temporal: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # GeoLibre — map tiling / geodata server.
  # NOTE: GeoLibre does not publish an official pre-built container image.
  # Manual step (one-time):
  #   git clone https://github.com/opengeos/GeoLibre /tmp/geolibre
  #   docker build -t h2fleet/geolibre:local /tmp/geolibre
  # then uncomment the service below. The PWA tile layer falls back to public
  # OSM tiles when GeoLibre is absent, so it is optional for local dev.
  # ---------------------------------------------------------------------------
  # geolibre:
  #   image: h2fleet/geolibre:local   # built manually, see note above
  #   container_name: h2-geolibre
  #   networks: [h2net]
  #   ports:
  #     - "8800:8000"
  #   volumes:
  #     - geolibre_data:/data

  # ===========================================================================
  # PLATFORM SERVICES (profile: apps) — built from ../services/* and ../apps/pwa
  # Internal ports per SPEC §3.6. Host ports are 18xxx for direct debugging;
  # the supported entrypoint is APISIX on :9080.
  # All services wait for the goose `migrator` one-shot (schema is ready).
  # ===========================================================================

  toggle-service:
    build:
      context: ..
      dockerfile: services/go/toggle-service/Dockerfile
    container_name: h2-toggle-service
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18080:8080"]
    environment:
      <<: *h2-env
      PORT: "8080"
      PERMIFY_GRPC: permify:3476
      PERMIFY_TENANT: t1
      AUDIT_LOG_URL: http://audit-log:8086
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:?set_AUDIT_INGEST_TOKEN_in_.env}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  fleet-api:
    build:
      context: ..
      dockerfile: services/go/fleet-api/Dockerfile
    container_name: h2-fleet-api
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18081:8081"]
    environment:
      <<: *h2-env
      PORT: "8081"
      PERMIFY_GRPC: permify:3476
    depends_on:
      postgres: { condition: service_healthy }
      toggle-service: { condition: service_started }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  infra-api:
    build:
      context: ..
      dockerfile: services/go/infra-api/Dockerfile
    container_name: h2-infra-api
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18082:8082"]
    environment:
      <<: *h2-env
      PORT: "8082"
      PERMIFY_GRPC: permify:3476
      PERMIFY_TENANT: t1
      # Go service reads TEMPORAL_HOST (Temporal frontend address).
      TEMPORAL_HOST: temporal:7233
      # Shared-secret token for the H2 leak sensor ingest endpoint
      # (machine-to-machine; not a Keycloak flow).
      LEAK_INGEST_TOKEN: ${LEAK_INGEST_TOKEN:-dev-leak-token-change-me}
    depends_on:
      postgres: { condition: service_healthy }
      toggle-service: { condition: service_started }
      temporal: { condition: service_started }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  citizen-api:
    build:
      context: ..
      dockerfile: services/go/citizen-api/Dockerfile
    container_name: h2-citizen-api
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18083:8083"]
    environment:
      <<: *h2-env
      PORT: "8083"
      PERMIFY_GRPC: permify:3476
      # Go service reads OPENSEARCH_URL (full base URL, not host:port).
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: h2fleet-open
      DAPR_ENABLED: "true"           # pubsub/state via Dapr sidecar (citizen-api-daprd)
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"        # sidecar shares this container's netns
      DAPR_PUBSUB_NAME: h2pubsub
    depends_on:
      postgres: { condition: service_healthy }
      toggle-service: { condition: service_started }
      migrator: { condition: service_completed_successfully }
      opensearch-bootstrap: { condition: service_completed_successfully }
      citizen-api-daprd: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # Dapr sidecar for citizen-api. Shares the app's network namespace
  # (network_mode: service:…) so the Go dapr SDK default dial 127.0.0.1:50001
  # works exactly like the k8s sidecar; no placement service needed (no actors).
  citizen-api-daprd:
    image: daprio/daprd:1.17.5
    container_name: h2-citizen-api-daprd
    profiles: ["apps", "all"]
    network_mode: service:citizen-api
    command:
      - ./daprd
      - --app-id=citizen-api
      - --app-port=8083
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --components-path=/components
      - --log-level=warn
    volumes:
      - ../infra/dapr/components:/components:ro
    depends_on:
      citizen-api: { condition: service_started }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  commerce-api:
    build:
      context: ..
      dockerfile: services/go/commerce-api/Dockerfile
    container_name: h2-commerce-api
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18084:8084"]
    environment:
      <<: *h2-env
      PORT: "8084"
      PERMIFY_GRPC: permify:3476
      TIGERBEETLE_ADDR: tigerbeetle:3000
      MOJALOOP_ENDPOINT: http://mojaloop-simulator:8444
      DAPR_ENABLED: "true"
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      DAPR_PUBSUB_NAME: h2pubsub
      AUDIT_LOG_URL: http://audit-log:8086
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:?set_AUDIT_INGEST_TOKEN_in_.env}
    depends_on:
      postgres: { condition: service_healthy }
      toggle-service: { condition: service_started }
      tigerbeetle: { condition: service_started }
      migrator: { condition: service_completed_successfully }
      commerce-api-daprd: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  commerce-api-daprd:
    image: daprio/daprd:1.17.5
    container_name: h2-commerce-api-daprd
    profiles: ["apps", "all"]
    network_mode: service:commerce-api
    command:
      - ./daprd
      - --app-id=commerce-api
      - --app-port=8084
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --components-path=/components
      - --log-level=warn
    volumes:
      - ../infra/dapr/components:/components:ro
    depends_on:
      commerce-api: { condition: service_started }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  telemetry-ingest:
    build: ../services/rust/telemetry-ingest
    container_name: h2-telemetry-ingest
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18093:8093"]
    environment:
      <<: *h2-env
      PORT: "8093"
      RUST_LOG: info
      INPUT_TOPIC: telemetry.raw
      OUTPUT_TOPIC: telemetry.enriched
      TIGERBEETLE_ADDR: tigerbeetle:3000
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8093/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  digital-twin:
    build: ../services/rust/digital-twin
    container_name: h2-digital-twin
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18092:8092"]
    environment:
      <<: *h2-env
      PORT: "8092"
      RUST_LOG: info
      INPUT_TOPIC: telemetry.enriched
      OUTPUT_TOPIC: twin.updated
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  predictive-maintenance:
    build:
      context: ..
      dockerfile: services/python/predictive-maintenance/Dockerfile
    container_name: h2-predictive-maintenance
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18090:8090"]
    environment:
      <<: *h2-env
      PORT: "8090"
      MODEL_DIR: /app/models
      MODEL_ARTIFACTS_DIR: /artifacts
    volumes:
      - ml_artifacts:/artifacts
    depends_on:
      postgres: { condition: service_healthy }
      toggle-service: { condition: service_started }
      migrator: { condition: service_completed_successfully }
      ml-platform: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  route-optimizer:
    build:
      context: ..
      dockerfile: services/python/route-optimizer/Dockerfile
    container_name: h2-route-optimizer
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18091:8091"]
    environment:
      <<: *h2-env
      PORT: "8091"
    depends_on:
      postgres: { condition: service_healthy }
      toggle-service: { condition: service_started }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  carbon-analytics:
    build:
      context: ..
      dockerfile: services/python/carbon-analytics/Dockerfile
    container_name: h2-carbon-analytics
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18094:8094"]
    environment:
      <<: *h2-env
      PORT: "8094"
      TIGERBEETLE_ADDR: tigerbeetle:3000
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8094/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # Telemetry simulator — stands in for the 50 physical buses (and for the
  # documented Fluvio edge bridge, which is not implemented). Loads
  # fleet.vehicles, writes Redis bus:meta:* enrichment hashes and publishes
  # SPEC §3.3 envelopes to telemetry.raw every SIM_INTERVAL_SECONDS.
  telemetry-simulator:
    build:
      context: ..
      dockerfile: services/python/telemetry-simulator/Dockerfile
    container_name: h2-telemetry-simulator
    profiles: ["apps", "all"]
    networks: [h2net]
    environment:
      <<: *h2-env
      SIM_INTERVAL_SECONDS: "5"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

  # One-shot ETL runner (profile: etl). Submits the Sedona/Spark job that moves
  # Postgres telemetry -> Iceberg tables on MinIO. Run manually:
  #   docker compose -f infra/docker-compose.yml --profile etl run --rm lakehouse-etl
  lakehouse-etl:
    build:
      context: ..
      dockerfile: services/python/lakehouse-etl/Dockerfile
    container_name: h2-lakehouse-etl
    profiles: ["etl", "all"]
    networks: [h2net]
    environment:
      <<: *h2-env
      SPARK_MASTER: spark://spark-master:7077
      ICEBERG_REST: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-h2admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-h2adminpass}
    depends_on:
      spark-master: { condition: service_healthy }
      iceberg-rest: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: "no"

  # PWA build context is the REPO ROOT: the Dockerfile copies
  # packages/toggle-client/ts (file: dependency) plus apps/pwa.
  # VITE_* values are baked at build time (vite); the served app talks to
  # Keycloak at http://localhost:8088 (mapped above) with client h2fleet-pwa
  # and proxies /api -> apisix:9080 via its nginx config.
  pwa:
    build:
      context: ..
      dockerfile: apps/pwa/Dockerfile
    container_name: h2-pwa
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["3000:80"]
    depends_on:
      apisix: { condition: service_started }

  # ---------------------------------------------------------------------------
  # admin-api (Go, :8085) — platform admin control plane: organization/user
  # onboarding via the Keycloak Admin REST API, alert routing via Alertmanager.
  # Delivered by a parallel workstream; wired here against its env contract
  # (KEYCLOAK_ADMIN_URL / KEYCLOAK_ADMIN_CLIENT_ID / KEYCLOAK_ADMIN_CLIENT_SECRET
  # / ALERTMANAGER_URL + the shared x-h2-env set).
  # NOTE: the confidential Keycloak client named by KEYCLOAK_ADMIN_CLIENT_ID
  # (default `h2fleet-admin-api`) must exist in the h2fleet realm with a
  # service account granted the realm-management roles it needs — the realm
  # import is owned by another workstream; create the client manually in the
  # admin console (http://localhost:8180/admin) until then.
  # ---------------------------------------------------------------------------
  admin-api:
    build:
      context: ..
      dockerfile: services/go/admin-api/Dockerfile
    container_name: h2-admin-api
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18085:8085"]
    environment:
      <<: *h2-env
      PORT: "8085"
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-h2fleet-admin-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-h2fleet-admin-api-secret-change-me}
      ALERTMANAGER_URL: http://alertmanager:9093
      AUDIT_LOG_URL: http://audit-log:8086
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:?set_AUDIT_INGEST_TOKEN_in_.env}
    depends_on:
      keycloak: { condition: service_healthy }
      postgres: { condition: service_healthy }
      toggle-service: { condition: service_started }
      alertmanager: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # ml-platform (Python, :8095) — ML control plane: experiment tracking via
  # MLflow, model artifacts on a dedicated volume, optional Neo4j graph
  # features. Delivered by a parallel workstream; wired here against its env
  # contract (MLFLOW_TRACKING_URI / MODEL_ARTIFACTS_DIR / NEO4J_URI optional +
  # the shared x-h2-env set).
  # MLflow itself runs under the `ml` (or `all`) profile — `make ml`; under the
  # plain `apps` profile the tracking URI simply has nothing to talk to.
  # ---------------------------------------------------------------------------
  ml-platform:
    build:
      context: ..
      dockerfile: services/python/ml-platform/Dockerfile
    container_name: h2-ml-platform
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18095:8095"]
    environment:
      <<: *h2-env
      PORT: "8095"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_ARTIFACTS_DIR: /artifacts
      # Optional: only resolvable when the `graph` profile (neo4j) is up.
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j-dev-pass-change-me}
    volumes:
      - ml_artifacts:/artifacts
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
      # mlflow lives in the ml/all profiles; required:false keeps the `apps`
      # profile valid when mlflow is not part of the active compose model.
      mlflow: { condition: service_started, required: false }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8095/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # ===========================================================================
  # MLflow tracking server (profiles: ml, all) — `make ml`.
  # Backend store: dedicated `mlflow` database on the MAIN Postgres, created
  # idempotently by mlflow-db-init (same one-shot pattern as permify-db-init —
  # infra/sql is owned by another workstream, so we cannot add it to the init
  # scripts). Artifacts: s3://lakehouse/mlflow on MinIO (bucket created by
  # minio-init; credentials are the MINIO_ROOT_* pair).
  # UI: http://127.0.0.1:5000 (loopback only).
  # ===========================================================================
  mlflow-db-init:
    image: postgres:16.10-alpine
    container_name: h2-mlflow-db-init
    profiles: ["ml", "all"]
    networks: [h2net]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}
    entrypoint: >
      sh -c "psql -h postgres -U h2 -d h2fleet -tc
             \"SELECT 1 FROM pg_database WHERE datname='mlflow'\" | grep -q 1
             || psql -h postgres -U h2 -d h2fleet -c 'CREATE DATABASE mlflow'"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    container_name: h2-mlflow
    profiles: ["ml", "all"]
    networks: [h2net]
    ports:
      - "127.0.0.1:5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://h2:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/mlflow
      --default-artifact-root s3://lakehouse/mlflow
      --host 0.0.0.0 --port 5000
    environment:
      # S3-compatible artifact store = MinIO (boto3 picks up the AWS_* pair).
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-h2admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-h2adminpass}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      mlflow-db-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    healthcheck:
      # /health is MLflow's built-in liveness endpoint (returns 200 "OK").
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # OPTIONAL profile: graph — Neo4j 5 community, backing ml-platform's
  # optional graph features (NEO4J_URI=bolt://neo4j:7687). `make graph`.
  # Browser: http://127.0.0.1:7474 (user neo4j / NEO4J_PASSWORD).
  # ===========================================================================
  neo4j:
    image: neo4j:5.26.22-community
    container_name: h2-neo4j
    profiles: ["graph"]
    networks: [h2net]
    ports:
      - "127.0.0.1:7474:7474"   # browser / HTTP
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j-dev-pass-change-me}
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Password is parsed out of NEO4J_AUTH (neo4j/<password>) so we do not
      # need a second env var (arbitrary NEO4J_* vars are parsed as server
      # config by the Neo4j entrypoint and unknown ones fail startup).
      test: ["CMD-SHELL", "pw=$${NEO4J_AUTH#neo4j/}; cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$pw\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ===========================================================================
  # OPTIONAL profile: ray — small Ray cluster (head + one worker) for
  # distributed ML workloads complementing ml-platform. `make ray`.
  # Dashboard: http://127.0.0.1:8265  (GCS on ray-head:6379 in-network)
  # ===========================================================================
  ray-head:
    # SECURITY: Ray Jobs API is unauthenticated by design (audit 2026-07-25). Mitigation:
    # keep head/dashboard unreachable outside the cluster (NetworkPolicy default-deny). Plan upgrade to 2.4x.
    image: rayproject/ray:2.34.0-py311
    container_name: h2-ray-head
    profiles: ["ray"]
    networks: [h2net]
    ports:
      - "127.0.0.1:8265:8265"    # dashboard
      - "127.0.0.1:10001:10001"  # ray client server
    command: ["ray", "start", "--head", "--port=6379", "--dashboard-host=0.0.0.0", "--block"]
    shm_size: "1gb"   # Ray object store lives in /dev/shm
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8265/api/version').status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  ray-worker:
    # SECURITY: Ray Jobs API is unauthenticated by design (audit 2026-07-25). Mitigation:
    # keep head/dashboard unreachable outside the cluster (NetworkPolicy default-deny). Plan upgrade to 2.4x.
    image: rayproject/ray:2.34.0-py311
    container_name: h2-ray-worker
    profiles: ["ray"]
    networks: [h2net]
    command: ["ray", "start", "--address=ray-head:6379", "--block"]
    shm_size: "1gb"
    depends_on:
      ray-head: { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # audit-log (Go, :8086) — hash-chained, append-only audit trail for insider-
  # threat forensics. Persists to platform.audit_log (migration 0005), mirrors
  # to OpenSearch index h2fleet-audit, and raises anomaly alerts to
  # Alertmanager. Other services emit via AUDIT_LOG_URL/AUDIT_INGEST_TOKEN.
  # ---------------------------------------------------------------------------
  audit-log:
    build:
      context: ..
      dockerfile: services/go/audit-log/Dockerfile
    container_name: h2-audit-log
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18086:8086"]
    environment:
      <<: *h2-env
      PORT: "8086"
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:?set_AUDIT_INGEST_TOKEN_in_.env}
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: h2fleet-audit
      ALERTMANAGER_URL: http://alertmanager:9093
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_started }
      alertmanager: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # analytics-bff (TypeScript/Hono + Drizzle, :8096) — read-only analytics
  # backend-for-frontend serving the admin console (fleet summary, daily
  # revenue, daily carbon). Exercises the shared packages/db Drizzle schema.
  # ---------------------------------------------------------------------------
  analytics-bff:
    build:
      context: ..
      dockerfile: services/ts/analytics-bff/Dockerfile
    container_name: h2-analytics-bff
    profiles: ["apps", "all"]
    networks: [h2net]
    ports: ["18096:8096"]
    environment:
      PORT: "8096"
      DATABASE_URL: postgres://h2:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@postgres:5432/h2fleet?sslmode=disable
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/h2fleet
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-services}
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8096/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
