# Dapr state store backed by Redis.
# Holds citizen sessions, DRT request state and commerce idempotency keys.
# (The toggle cache and twin hot state use dedicated Redis keys with their own
# prefixes and do not go through Dapr.)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: h2state
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "false"
    - name: keyPrefix
      value: "h2state:"
scopes:
  - citizen-api
  - commerce-api
