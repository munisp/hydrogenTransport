# Shared H2Fleet secrets. Consumed via envFrom secretRef by all services
# (DATABASE_URL) plus targeted secretKeyRef entries (LEAK_INGEST_TOKEN).
#
# DEV VALUES ONLY. In any real environment source these from an external
# secrets manager (ExternalSecrets Operator, Sealed Secrets, SOPS) and do NOT
# commit real values. Rotation procedure: docs/SECRETS.md.
apiVersion: v1
kind: Secret
metadata:
  name: h2fleet-secrets
  namespace: h2fleet
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME_provision_via_external_secrets_or_kustomize_secretGenerator"
  LEAK_INGEST_TOKEN: "REPLACE_ME_provision_a_strong_token"
  # admin-api: confidential Keycloak client (h2fleet realm) for the Admin REST API
  KEYCLOAK_ADMIN_CLIENT_SECRET: "REPLACE_ME_provision_keycloak_client_secret"
  # ml-platform (optional graph features): bolt password for the Neo4j deployment
  NEO4J_PASSWORD: "REPLACE_ME_provision_neo4j_password"
