# PodDisruptionBudgets — keep at least one replica serving during voluntary
# disruptions (node drains, cluster upgrades). Single-replica services use
# maxUnavailable: 1 so drains are not blocked but stay observable.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleet-api
  namespace: h2fleet
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fleet-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: citizen-api
  namespace: h2fleet
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: citizen-api
---
