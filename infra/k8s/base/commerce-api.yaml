apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-api
  namespace: h2fleet
  labels:
    app: commerce-api
    app.kubernetes.io/part-of: h2fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-api
  template:
    metadata:
      labels:
        app: commerce-api
    spec:
      containers:
        - name: commerce-api
          image: ghcr.io/munisp/h2fleet/commerce-api:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: h2fleet-config
            - secretRef:
                name: h2fleet-secrets
          env:
            - name: PORT
              value: "8084"
          readinessProbe:
            httpGet: { path: /healthz, port: 8084 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8084 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: commerce-api
  namespace: h2fleet
spec:
  selector:
    app: commerce-api
  ports:
    - name: http
      port: 8084
      targetPort: 8084
