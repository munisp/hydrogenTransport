apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-twin
  namespace: h2fleet
  labels:
    app: digital-twin
    app.kubernetes.io/part-of: h2fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: digital-twin
  template:
    metadata:
      labels:
        app: digital-twin
    spec:
      containers:
        - name: digital-twin
          # SECURITY_AUDIT F13: never deploy a mutable :latest tag.
          # :REPLACE_ME is a deliberate placeholder — overlays pin the tag
          # via kustomize `images:` (dev overlay uses :dev); release pipelines
          # must set an immutable tag/digest before applying base directly.
          image: ghcr.io/munisp/h2fleet/digital-twin:REPLACE_ME
          ports:
            - containerPort: 8092
          envFrom:
            - configMapRef:
                name: h2fleet-config
            - secretRef:
                name: h2fleet-secrets
          env:
            - name: PORT
              value: "8092"
          readinessProbe:
            httpGet: { path: /healthz, port: 8092 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8092 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 700m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: digital-twin
  namespace: h2fleet
spec:
  selector:
    app: digital-twin
  ports:
    - name: http
      port: 8092
      targetPort: 8092
