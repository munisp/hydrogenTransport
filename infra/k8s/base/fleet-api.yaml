apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-api
  namespace: h2fleet
  labels:
    app: fleet-api
    app.kubernetes.io/part-of: h2fleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleet-api
  template:
    metadata:
      labels:
        app: fleet-api
    spec:
      containers:
        - name: fleet-api
          image: ghcr.io/munisp/h2fleet/fleet-api:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: h2fleet-config
          env:
            - name: PORT
              value: "8081"
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-api
  namespace: h2fleet
spec:
  selector:
    app: fleet-api
  ports:
    - name: http
      port: 8081
      targetPort: 8081
