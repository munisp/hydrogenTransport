apiVersion: apps/v1
kind: Deployment
metadata:
  name: toggle-service
  namespace: h2fleet
  labels:
    app: toggle-service
    app.kubernetes.io/part-of: h2fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toggle-service
  template:
    metadata:
      labels:
        app: toggle-service
    spec:
      containers:
        - name: toggle-service
          image: ghcr.io/munisp/h2fleet/toggle-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: h2fleet-config
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: toggle-service
  namespace: h2fleet
spec:
  selector:
    app: toggle-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
