apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingest
  namespace: h2fleet
  labels:
    app: telemetry-ingest
    app.kubernetes.io/part-of: h2fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-ingest
  template:
    metadata:
      labels:
        app: telemetry-ingest
    spec:
      containers:
        - name: telemetry-ingest
          image: ghcr.io/munisp/h2fleet/telemetry-ingest:latest
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef:
                name: h2fleet-config
            - secretRef:
                name: h2fleet-secrets
          env:
            - name: PORT
              value: "8093"
          readinessProbe:
            httpGet: { path: /healthz, port: 8093 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8093 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 700m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-ingest
  namespace: h2fleet
spec:
  selector:
    app: telemetry-ingest
  ports:
    - name: http
      port: 8093
      targetPort: 8093
