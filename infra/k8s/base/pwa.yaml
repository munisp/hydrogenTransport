apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwa
  namespace: h2fleet
  labels:
    app: pwa
    app.kubernetes.io/part-of: h2fleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pwa
  template:
    metadata:
      labels:
        app: pwa
    spec:
      containers:
        - name: pwa
          image: ghcr.io/munisp/h2fleet/pwa:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: h2fleet-config
            - secretRef:
                name: h2fleet-secrets
          env:
            - name: PORT
              value: "80"
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pwa
  namespace: h2fleet
spec:
  selector:
    app: pwa
  ports:
    - name: http
      port: 80
      targetPort: 80
