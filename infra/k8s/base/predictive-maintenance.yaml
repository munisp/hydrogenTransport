apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-maintenance
  namespace: h2fleet
  labels:
    app: predictive-maintenance
    app.kubernetes.io/part-of: h2fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictive-maintenance
  template:
    metadata:
      labels:
        app: predictive-maintenance
    spec:
      containers:
        - name: predictive-maintenance
          # SECURITY_AUDIT F13: never deploy a mutable :latest tag.
          # :REPLACE_ME is a deliberate placeholder — overlays pin the tag
          # via kustomize `images:` (dev overlay uses :dev); release pipelines
          # must set an immutable tag/digest before applying base directly.
          image: ghcr.io/munisp/h2fleet/predictive-maintenance:REPLACE_ME
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: h2fleet-config
            - secretRef:
                name: h2fleet-secrets
          env:
            - name: PORT
              value: "8090"
          readinessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: predictive-maintenance
  namespace: h2fleet
spec:
  selector:
    app: predictive-maintenance
  ports:
    - name: http
      port: 8090
      targetPort: 8090
