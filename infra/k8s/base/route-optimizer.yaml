apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-optimizer
  namespace: h2fleet
  labels:
    app: route-optimizer
    app.kubernetes.io/part-of: h2fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-optimizer
  template:
    metadata:
      labels:
        app: route-optimizer
    spec:
      containers:
        - name: route-optimizer
          image: ghcr.io/munisp/h2fleet/route-optimizer:latest
          ports:
            - containerPort: 8091
          envFrom:
            - configMapRef:
                name: h2fleet-config
            - secretRef:
                name: h2fleet-secrets
          env:
            - name: PORT
              value: "8091"
          readinessProbe:
            httpGet: { path: /healthz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8091 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: route-optimizer
  namespace: h2fleet
spec:
  selector:
    app: route-optimizer
  ports:
    - name: http
      port: 8091
      targetPort: 8091
