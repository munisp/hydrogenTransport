# Dev overlay — "city-pilot" style deployment: only the fleet + infra domains
# are enabled. toggle-service seeds/enables only modules whose domain is in
# TOGGLE_DOMAINS; all citizen/commerce routes therefore return 404 and their
# consumers/workflows do not start (SPEC §1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: h2fleet
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: h2fleet-config
    patch: |-
      - op: replace
        path: /data/TOGGLE_DOMAINS
        value: "fleet,infra"
  # dev: single replica of everything, no autoscalers
  - target:
      kind: Deployment
      name: fleet-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: citizen-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: pwa
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: fleet-api
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: fleet-api
  - target:
      kind: HorizontalPodAutoscaler
      name: citizen-api
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: citizen-api
images:
  - name: ghcr.io/munisp/h2fleet/toggle-service
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/fleet-api
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/infra-api
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/citizen-api
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/commerce-api
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/telemetry-ingest
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/digital-twin
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/predictive-maintenance
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/route-optimizer
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/carbon-analytics
    newTag: dev
  - name: ghcr.io/munisp/h2fleet/pwa
    newTag: dev
