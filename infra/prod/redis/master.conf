# Redis MASTER — prod overlay (toggle cache, twin hot state, sessions).
# AOF everysec: <=1s data loss on crash, ~no fsync pressure on the hot path.
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb

# Replication: the replica streams from here.
replica-serve-stale-data yes
repl-diskless-sync yes
repl-diskless-sync-delay 5

# Memory: cache-ish workloads (toggle cache, sessions) evict; see
# infra/tuning/redis.conf for the twin-DB noeviction note.
maxmemory 512mb
maxmemory-policy allkeys-lru

# Durability beats raw speed for the twin hot state: also snapshot.
save 900 1
save 300 10
save 60 10000

# Hardening
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Disable server-side Lua scripting: renaming EVAL/EVALSHA to "" makes them
# unavailable, so a compromised client cannot run arbitrary Lua on the server.
# Verified safe: no platform code uses EVAL/EVALSHA (grep across services/ —
# toggle-service uses GET/SET/PING, digital-twin SET/SADD/MGET/PING,
# telemetry-simulator HSET; the only "eval" matches are torch `net.eval()`
# calls, unrelated). Dev stack untouched.
rename-command EVAL ""
rename-command EVALSHA ""
