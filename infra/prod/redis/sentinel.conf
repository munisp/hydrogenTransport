# Redis SENTINEL — 3 instances run this identical config (quorum 2).
# Mounted read-only is fine EXCEPT Sentinel rewrites its config to persist
# leader state; mount onto a writable copy per container if you need restart-
# safe sentinel state (volumes sentinel{1,2,3}_data hold /data for that).
port 26379
dir /data
daemonize no
protected-mode no

sentinel monitor h2master redis 6379 2
sentinel down-after-milliseconds h2master 5000
sentinel failover-timeout h2master 30000
sentinel parallel-syncs h2master 1

# Compose DNS: masters announce as `redis` / `redis-replica`.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
