# Redis REPLICA — prod overlay. Follows the master; promoted by Sentinel on
# failover.
replicaof redis 6379
replica-read-only yes

appendonly yes
appendfsync everysec

maxmemory 512mb
maxmemory-policy allkeys-lru

protected-mode yes
tcp-keepalive 300

# Disable server-side Lua here too: Sentinel can PROMOTE this replica to
# master, and the promotion must not re-enable EVAL/EVALSHA (see master.conf
# hardening note; no platform code uses them).
rename-command EVAL ""
rename-command EVALSHA ""

# Announce itself under the service name so Sentinel reports a reachable addr.
replica-announce-ip redis-replica
replica-announce-port 6379
