# gateway-lb: HAProxy in front of the two APISIX data-plane nodes.
# Publishes the SAME :9080 the dev stack exposed directly from apisix.
# Keycloak nodes are also balanced here for browser flows (sticky, KC_NODE).

global
    maxconn 20000
    stats socket /tmp/haproxy.sock mode 600 level admin

defaults
    mode http
    option httplog
    option dontlognull
    option http-keep-alive
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    retries 2

# --- API gateway data plane --------------------------------------------------
frontend apisix_front
    bind *:9080
    default_backend apisix_nodes

backend apisix_nodes
    balance roundrobin
    option httpchk GET /apisix/status
    http-check expect status 200
    server apisix   apisix:9080   check inter 5s fall 3 rise 2 maxconn 10000
    server apisix-2 apisix-2:9080 check inter 5s fall 3 rise 2 maxconn 10000

# --- Keycloak (browser OIDC flows need node affinity) -------------------------
frontend keycloak_front
    bind *:8180
    default_backend keycloak_nodes

backend keycloak_nodes
    balance source
    # Sticky sessions: Keycloak auth sessions are cache-locality sensitive;
    # HAProxy sets a node cookie and honors it on return visits.
    cookie KC_NODE insert indirect nocache
    option httpchk GET /health/ready HTTP/1.1\r\nHost:\ localhost
    server keycloak   keycloak:8080   check inter 5s fall 3 rise 2 cookie kc1
    server keycloak-2 keycloak-2:8080 check inter 5s fall 3 rise 2 cookie kc2
