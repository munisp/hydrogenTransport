# =============================================================================
# APISIX standalone route definitions — SPEC §3.6 gateway map
#
#   /api/toggles/*  -> toggle-service:8080      /api/fleet/*    -> fleet-api:8081
#   /api/infra/*    -> infra-api:8082           /api/citizen/*  -> citizen-api:8083
#   /api/commerce/* -> commerce-api:8084        /api/ml/*       -> predictive-maintenance:8090
#   /api/admin/*    -> admin-api:8085            /api/audit/*   -> audit-log:8086
#   /api/analytics/* -> analytics-bff:8096
#   /api/optimize/* -> route-optimizer:8091     /api/twin/*     -> digital-twin:8092
#   /api/open-data/* -> citizen-api:8083 (open-data surface, key-auth)
#
# carbon-analytics:8094 is deliberately NOT mapped to any /api/* prefix: it is
# an internal batch/analytics service reachable only inside the cluster
# network. Do not add a public route for it (see docs/GATEWAY.md).
#
# Every route uses proxy-rewrite to strip the "/api/<domain>" prefix so the
# upstreams see their native paths (e.g. /api/fleet/v1/vehicles -> /v1/vehicles).
#
# Auth model (defense in depth, see docs/GATEWAY.md §Authentication):
#   * openid-connect runs bearer_only on every /api/* route. With
#     `unauth_action: pass` a request WITHOUT a token is passed through instead
#     of 401'd at the edge — public GETs and /healthz keep working.
#   * When a bearer token IS present the gateway validates it against Keycloak
#     and forwards it; every backend service then enforces its own JWT
#     middleware on all mutating routes (Permify on admin routes).
#   * key-auth is used instead of OIDC on the machine-to-machine open-data
#     route (header `apikey`).
#
# Global rules (applied to EVERY route, see bottom of file):
#   * prometheus  — metrics exporter on :9091 (plugin_attr in config.yaml)
#   * cors        — PWA origin (env PWA_ORIGIN, default http://localhost:3000)
#   * openappsec  — OpenAppSec WAF, mode: detect by default; flip the single
#                   `mode:` value in the global rule to `prevent` to enforce.
#                   REQUIRES the openappsec-agent sidecar (compose profile
#                   `waf`) with AGENT_TOKEN set; see docs/GATEWAY.md §WAF.
# =============================================================================

routes:
  # ------------------------------------------------- leak ingest (sensors) --
  # Dedicated route for the H2 sensor webhook, declared AHEAD of the generic
  # /api/infra/* route so it can carry stricter rate limiting. The upstream
  # accepts either the shared sensor token (X-Sensor-Token / LEAK_INGEST_TOKEN)
  # or a Keycloak JWT — enforced in infra-api.
  - uri: /api/infra/v1/safety/leak
    methods: ["POST"]
    name: infra-leak-ingest
    upstream:
      type: roundrobin
      nodes:
        "infra-api:8082": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/infra(/.*)$", "$1"]
      # Stricter than the default API limit: sensor bursts should never be
      # able to stampede the incident pipeline.
      limit-req:
        rate: 10                # r/s per remote address
        burst: 20
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass     # sensors authenticate with X-Sensor-Token in-service

  # ------------------------------------------------------------- toggles ----
  - uri: /api/toggles/*
    name: toggles
    upstream:
      type: roundrobin
      nodes:
        "toggle-service:8080": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/toggles(/.*)$", "$1"]
      # Baseline limit (SECURITY_AUDIT F7).
      limit-count:
        count: 600
        time_window: 60
        rejected_code: 429
        key: remote_addr
      # GETs are public; PUT requires Keycloak role platform-admin (enforced in
      # toggle-service against the forwarded JWT).
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # GET /v1/toggles readable without a token

  # --------------------------------------------------------------- fleet ----
  - uri: /api/fleet/*
    name: fleet
    upstream:
      type: roundrobin
      nodes:
        "fleet-api:8081": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/fleet(/.*)$", "$1"]
      # Baseline limit (SECURITY_AUDIT F7).
      limit-count:
        count: 600
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT on mutating routes

  # ------------------------------------------- incident intake (citizens) --
  # Dedicated route AHEAD of the generic /api/infra/* route: any citizen JWT
  # may open a safety incident in-service, so the edge caps the false-alarm
  # flood (SECURITY_AUDIT F12).
  - uri: /api/infra/v1/incidents
    methods: ["POST"]
    name: infra-incident-intake
    upstream:
      type: roundrobin
      nodes:
        "infra-api:8082": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/infra(/.*)$", "$1"]
      limit-count:
        count: 30                 # requests per time_window per remote address
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT

  # --------------------------------------------------------------- infra ----
  - uri: /api/infra/*
    name: infra
    upstream:
      type: roundrobin
      nodes:
        "infra-api:8082": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/infra(/.*)$", "$1"]
      # Baseline limit (SECURITY_AUDIT F7); stricter limits on the dedicated
      # leak/incident routes above take precedence.
      limit-count:
        count: 600
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT on mutating routes

  # ------------------------------------------------- citizen DRT mutations --
  # Dedicated route AHEAD of the generic /api/citizen/* route: DRT request
  # creation/cancellation is a mutating, DB-backed flow available to every
  # citizen account (self-serve onboarding makes accounts free), so it gets a
  # much tighter limit than the public read surface (SECURITY_AUDIT F4/F7).
  - uri: /api/citizen/v1/drt/*
    methods: ["POST"]
    name: citizen-drt-mutations
    upstream:
      type: roundrobin
      nodes:
        "citizen-api:8083": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/citizen(/.*)$", "$1"]
      limit-count:
        count: 30                 # requests per time_window per remote address
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT on mutations

  # -------------------------------------------------------------- citizen ---
  - uri: /api/citizen/*
    name: citizen
    upstream:
      type: roundrobin
      nodes:
        "citizen-api:8083": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/citizen(/.*)$", "$1"]
      limit-count:
        count: 600                # requests per time_window per remote address
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # arrivals/alerts are public; mutations 401 in service

  # ------------------------------------------------------ payment intake ---
  # Dedicated route AHEAD of the generic /api/commerce/* route: payment
  # creation moves money (ledger + Mojaloop leg), so it carries the strictest
  # commerce limit (SECURITY_AUDIT F7 names POST /v1/payments as most
  # abusable).
  - uri: /api/commerce/v1/payments
    methods: ["POST"]
    name: commerce-payments
    upstream:
      type: roundrobin
      nodes:
        "commerce-api:8084": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/commerce(/.*)$", "$1"]
      limit-count:
        count: 60                 # requests per time_window per remote address
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT

  # ------------------------------------------------------------- commerce ---
  - uri: /api/commerce/*
    name: commerce
    upstream:
      type: roundrobin
      nodes:
        "commerce-api:8084": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/commerce(/.*)$", "$1"]
      # Baseline limit (SECURITY_AUDIT F7).
      limit-count:
        count: 600
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT on mutating routes

  # ---------------------------------------- public onboarding intake (F4) --
  # Dedicated route AHEAD of the generic /api/admin/* route with a STRICT
  # limit: the unauthenticated self-serve/intake endpoints provision Keycloak
  # users and send verification emails to arbitrary addresses, so without a
  # tight per-IP cap the platform is an email-bombing / DB-spam tool
  # (SECURITY_AUDIT F4). ~5 requests/min/IP; the 300/min generic admin limit
  # still applies on top.
  - uri: /api/admin/v1/onboarding/*
    methods: ["POST"]
    name: admin-onboarding-intake
    upstream:
      type: roundrobin
      nodes:
        "admin-api:8085": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/admin(/.*)$", "$1"]
      limit-req:
        rate: 0.1                 # r/s per remote address (~6 r/min)
        burst: 5
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # public intake; service validates payloads

  # ---------------------------------------------------------------- admin ---
  # Admin & onboarding backend (admin-api). Public surfaces: POST
  # /v1/onboarding/citizen and /v1/onboarding/{persona} intake; everything
  # else requires a Keycloak JWT with platform-admin/operator roles enforced
  # in-service (unauth_action: pass lets the public intake through).
  - uri: /api/admin/*
    name: admin
    upstream:
      type: roundrobin
      nodes:
        "admin-api:8085": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/admin(/.*)$", "$1"]
      limit-count:
        count: 300                # requests per time_window per remote address
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # public onboarding intake; admin routes 401/403 in service

  # Audit trail (audit-log). GET /v1/audit + /v1/audit/verify are
  # platform-admin only, enforced in-service; POST /v1/audit ingest is
  # service-to-service via X-Audit-Token (or JWT) — never public.
  - uri: /api/audit/*
    name: audit-log
    upstream:
      type: roundrobin
      nodes:
        "audit-log:8086": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/audit(/.*)$", "$1"]
      limit-count:
        count: 600
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces ingest token / platform-admin JWT

  # Analytics BFF (Hono + Drizzle). Read-only admin-console analytics;
  # JWT enforced in-service (fail-closed when KEYCLOAK_ISSUER is unset).
  - uri: /api/analytics/*
    name: analytics-bff
    upstream:
      type: roundrobin
      nodes:
        "analytics-bff:8096": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/analytics(/.*)$", "$1"]
      # Baseline limit (SECURITY_AUDIT F7).
      limit-count:
        count: 600
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT on all routes

  # ------------------------------------------------------------------- ml ---
  - uri: /api/mlplatform/*
    name: mlplatform
    upstream:
      type: roundrobin
      nodes:
        "ml-platform:8095": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/mlplatform(/.*)$", "$1"]
      # Baseline limit (SECURITY_AUDIT F7).
      limit-count:
        count: 600
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT on mutating routes

  - uri: /api/ml/*
    name: predictive-maintenance
    upstream:
      type: roundrobin
      nodes:
        "predictive-maintenance:8090": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/ml(/.*)$", "$1"]
      # Baseline limit (SECURITY_AUDIT F7).
      limit-count:
        count: 600
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT on mutating routes

  # -------------------------------------------------------------- optimize --
  # Dedicated route for the CPU-heavy OR-Tools solver (SECURITY_AUDIT F7
  # names POST /v1/optimize/route as one of the most abusable endpoints).
  - uri: /api/optimize/v1/optimize/route
    methods: ["POST"]
    name: optimize-solve
    upstream:
      type: roundrobin
      nodes:
        "route-optimizer:8091": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/optimize(/.*)$", "$1"]
      limit-req:
        rate: 0.2                 # r/s per remote address (~12 r/min)
        burst: 3
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT

  - uri: /api/optimize/*
    name: route-optimizer
    upstream:
      type: roundrobin
      nodes:
        "route-optimizer:8091": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/optimize(/.*)$", "$1"]
      # Baseline limit (SECURITY_AUDIT F7).
      limit-count:
        count: 120
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT on mutating routes

  # ------------------------------------------------------------------ twin --
  - uri: /api/twin/*
    name: digital-twin
    upstream:
      type: roundrobin
      nodes:
        "digital-twin:8092": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/twin(/.*)$", "$1"]
      # Baseline limit (SECURITY_AUDIT F7).
      limit-count:
        count: 600
        time_window: 60
        rejected_code: 429
        key: remote_addr
      openid-connect:
        bearer_only: true
        client_id: services
        client_secret: "${{KEYCLOAK_SERVICES_CLIENT_SECRET:=REPLACE_ME_VIA_KEYCLOAK_SERVICES_CLIENT_SECRET}}"
        discovery: http://keycloak:8080/realms/h2fleet/.well-known/openid-configuration
        unauth_action: pass        # service enforces JWT on mutating routes

  # ------------------------------------- machine-to-machine (key-auth demo) -
  # External data consumers hit the open-data API with an API key (header
  # `apikey`) instead of OIDC. Consumer `data-partner` is declared below.
  - uri: /api/open-data/*
    name: open-data-keyauth
    upstream:
      type: roundrobin
      nodes:
        "citizen-api:8083": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/open-data(/.*)$", "/v1/opendata$1"]
      limit-count:
        count: 600                # requests per time_window per remote address
        time_window: 60
        rejected_code: 429
        key: remote_addr
      key-auth:
        header: apikey

consumers:
  - username: data-partner
    plugins:
      key-auth:
        # PLACEHOLDER — real keys are provisioned per partner via a secret
        # manager (or the APISIX secret reference `$ENV://H2_PARTNER_API_KEY`).
        # Never commit a production key here; see docs/GATEWAY.md §Secrets.
        key: REPLACE_ME_PROVISION_PER_PARTNER

# =============================================================================
# Global rules — plugins applied to EVERY route (all /api/* traffic).
# =============================================================================
global_rules:
  - id: 1
    plugins:
      # Prometheus metrics exporter (listens on :9091 per plugin_attr in
      # config.yaml; publish that port for the Prometheus server to scrape).
      prometheus: {}

      # Global rate-limit backstop (SECURITY_AUDIT F7): every route carries a
      # limit even if a future route forgets to declare one. Routes with their
      # own limit-count/limit-req plugin override this per APISIX plugin
      # precedence.
      limit-count:
        count: 1200               # requests per time_window per remote address
        time_window: 60
        rejected_code: 429
        key: remote_addr

      # CORS for the PWA (apps/pwa). Origin is env-overridable via PWA_ORIGIN
      # (APISIX expands ${{VAR:=default}}); default matches the local compose
      # stack where the PWA is served at http://localhost:3000. Credentials are
      # allowed because the PWA sends the Keycloak bearer token / cookies.
      # NOTE: with allow_credential=true the origin must be explicit (never *).
      cors:
        allow_origins: "${{PWA_ORIGIN:=http://localhost:3000}}"
        allow_methods: "**"
        allow_headers: "**"
        expose_headers: "**"
        max_age: 5
        allow_credential: true

      # OpenAppSec WAF (nano-agent attachment).
      # TOGGLE: default `detect` (learn/log only). Change the single value
      # below to `prevent` to start blocking.
      #   * Requires the openappsec-agent sidecar on this network (compose
      #     profile `waf`) with AGENT_TOKEN set — see docs/GATEWAY.md §WAF.
      #   * If the agent is NOT deployed, comment this plugin out; an
      #     unreachable agent can add latency or fail requests depending on
      #     agent connectivity.
      openappsec:
        host: http://openappsec-agent:8081
        mode: detect            # TOGGLE: "prevent" to enforce blocking

#END
