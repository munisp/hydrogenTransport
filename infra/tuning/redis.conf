# =============================================================================
# Redis tuning — H2Fleet (toggle cache, twin hot state, sessions, simulator).
#
# ONE instance today serves several logical databases with DIFFERENT eviction
# needs. maxmemory-policy is instance-wide, so the policy below is the safe
# compromise; the per-domain guidance:
#
#   * toggle cache (toggles:*), sessions, simulator bus:meta — CACHE data:
#     evictable. allkeys-lru is correct.
#   * digital-twin hot state (twin:*), idempotency keys — NOT evictable:
#     losing them corrupts twin state / weakens payment idempotency.
#
# RECOMMENDATION: split into two logical deployments in prod —
#   redis-cache (allkeys-lru, no AOF needed, RDB off) and
#   redis-twin  (noeviction + AOF everysec + alerts on used_memory).
# If you keep one instance, use `noeviction` and give the cache clients
# explicit TTLs (toggle cache already uses 30s TTL per SPEC §3.2).
# The compose prod master runs the cache-leaning posture below; the twin
# split is tracked in docs/MIDDLEWARE_HARDENING.md §Redis.
# =============================================================================

appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb

# Memory posture: cache-leaning. See header for the twin-DB noeviction note.
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10               # better LRU approx for ~1% CPU

save 900 1
save 300 10
save 60 10000

# Latency: Redis is on the request path of every service (toggle checks).
hz 100                             # active expiry cycle for TTL-heavy cache keys
dynamic-hz yes
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Actively defrag the allocator for long-lived twin hashes.
activedefrag yes
active-defrag-cycle-min 10
active-defrag-cycle-max 50

# Jemalloc background purging.
jemalloc-bg-thread yes
