# =============================================================================
# PWA static-serving nginx tuning (apps/pwa container).
#
# The PWA is a Vite build: content-hashed assets under /assets/ are immutable;
# index.html and manifest must never be cached stale. Static payload is the
# single largest byte-flow to citizens, so compression matters more here than
# anywhere else.
#
# Brotli: the stock nginx:alpine image has no brotli module. Options:
#   1. Use an image with ngx_brotli baked (e.g. build FROM nginx:alpine and
#      add nginx-module-brotli from Alpine packages).
#   2. Pre-compress at build time (vite-plugin-compression emits .br/.gz) and
#      serve with `brotli_static on` / `gzip_static on` — ZERO runtime CPU.
# Option 2 is the recommendation (drop-in with the snippet below).
# =============================================================================

# --- http context -------------------------------------------------------------
#gzip on;
#gzip_vary on;
#gzip_proxied any;
#gzip_comp_level 5;              # with gzip_static pre-compression, runtime
                                 # gzip is only a fallback — keep level low
#gzip_min_length 1k;
#gzip_types text/css application/javascript application/json image/svg+xml
#           application/manifest+json font/woff2;
#
## Requires ngx_brotli (see header):
#brotli on;
#brotli_static on;               # serve Vite-emitted .br files directly
#brotli_comp_level 4;
#brotli_types text/css application/javascript application/json image/svg+xml
#             application/manifest+json font/woff2;
#
#gzip_static on;                 # serve Vite-emitted .gz directly

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Content-hashed build artifacts: immutable, cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker + manifest: correctness-critical, never stale.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # SPA shell: revalidate every load; history API fallback.
    location / {
        expires off;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
