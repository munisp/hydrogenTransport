# =============================================================================
# H2Fleet Postgres 16 tuning — fleet workload profile.
#
# Workload shape (SPEC §3.4):
#   * fleet.telemetry: TimescaleDB hypertable, append-heavy inserts
#     (50 buses × 1 Hz ≈ 50 rows/s dev; 10k buses ≈ 10k rows/s target)
#   * OLTP reads/writes: feature_toggles, fare_payments, incidents, stations
#   * digital-twin hot-state checkpoints (write bursts from Rust twin engine)
#   * GIS predicates (PostGIS geometry(Point,4326)) on read paths
#
# Target host: 8 vCPU / 32 GB RAM / SSD. Scale linearly: shared_buffers 25%
# RAM, effective_cache_size 70% RAM.
#
# Apply via: mount + `-c config_file=`, ALTER SYSTEM, or CloudNativePG
# `postgresql.parameters` (K8S_NOTES.md §Postgres).
# =============================================================================

# --- memory ------------------------------------------------------------------
shared_buffers = 8GB                  # 25% of 32GB
effective_cache_size = 22GB           # ~70% RAM: planner assumes OS cache helps
work_mem = 64MB                       # per sort/hash op; telemetry rollups are
                                      # the big consumers — keep * max_connections
                                      # worst case < RAM (200 conns × few ops)
maintenance_work_mem = 1GB            # VACUUM/CREATE INDEX on telemetry chunks
huge_pages = try

# --- WAL / checkpointing (insert-heavy) ---------------------------------------
wal_level = replica                   # required for postgres-replica (prod)
max_wal_senders = 10
max_replication_slots = 10
max_wal_size = 8GB                    # spread checkpoints: fewer write stalls
min_wal_size = 2GB
checkpoint_completion_target = 0.9
wal_compression = on                  # full-page images compress well (telemetry)
wal_keep_size = 1GB
hot_standby = on
hot_standby_feedback = on
synchronous_commit = on               # use 'off' ONLY for telemetry bulk load jobs

# --- planner ------------------------------------------------------------------
random_page_cost = 1.1                # SSD
effective_io_concurrency = 200        # SSD async reads
default_statistics_target = 200       # better estimates on skewed telemetry cols

# --- parallelism ---------------------------------------------------------------
max_worker_processes = 8
max_parallel_workers_per_gather = 2   # hypertable chunk scans
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# --- connections ----------------------------------------------------------------
max_connections = 200                 # put PgBouncer/CNPG Pooler in front beyond this
superuser_reserved_connections = 5
idle_in_transaction_session_timeout = 60000   # kill leaked txns from app bugs

# --- logging / ops ---------------------------------------------------------------
log_min_duration_statement = 500      # ms — catches slow GIS + rollup queries
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = 1000
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.track = all

# --- autovacuum: telemetry churn + twin checkpoints need it fed -----------------
autovacuum_max_workers = 4
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
