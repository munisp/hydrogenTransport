# =============================================================================
# Kafka broker tuning — H2Fleet production (KRaft, rf=3, min ISR=2).
#
# Reference form: Apache server.properties keys. The compose overlay maps these
# to bitnami KAFKA_CFG_* env vars; Strimzi gets them via spec.kafka.config.
#
# Throughput rationale (docs/MIDDLEWARE_HARDENING.md §throughput):
#   * telemetry.raw is the hot topic: 12 partitions so up to 12 consumer
#     instances (telemetry-ingest replicas) work in parallel; per-partition
#     order preserved per bus (key = bus_id).
#   * lz4 everywhere: ~2-4x smaller on-the-wire JSON, near-zero CPU cost.
#   * Batching favors throughput over ~5ms of latency — telemetry tolerates
#     it; payment topics are low-volume so the tradeoff is harmless there.
# =============================================================================

# --- topics / replication ------------------------------------------------------
num.partitions=12
default.replication.factor=3
min.insync.replicas=2
unclean.leader.election.enable=false
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
auto.create.topics.enable=false

# --- producer-facing durability/performance ------------------------------------
compression.type=lz4
# Broker-side socket/IO sizing for 8-16 vCPU brokers.
num.network.threads=8
num.io.threads=16
socket.send.buffer.bytes=1024000
socket.receive.buffer.bytes=1024000
socket.request.max.bytes=104857600

# --- log retention: telemetry is also in TimescaleDB + lakehouse ---------------
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
log.cleaner.enable=true          # for compacted topics (twin.updated if compacted)
log.roll.ms=3600000

# --- flush: rely on replication, not fsync (Kafka doctrine) ---------------------
# Keep OS-managed flushing; durability comes from rf=3 + min ISR=2 + acks=all.
flush.messages=9223372036854775807
flush.ms=9223372036854775807

# --- recovery speed --------------------------------------------------------------
num.recovery.threads.per.data.dir=4
replica.fetch.max.bytes=8388608
# Leader imbalance churn is expensive at 12 partitions × rf=3 — keep on.
auto.leader.rebalance.enable=true
leader.imbalance.check.interval.seconds=300

# =============================================================================
# Producer-side (services — reference for Go franz-go / Rust rdkafka clients):
#   batch.size=131072        # 128 KiB per partition batch
#   linger.ms=20             # amortize; ~50x fewer produce requests at 1k msg/s
#   compression.type=lz4
#   acks=all                 # with min ISR=2: survives one broker loss
#   max.in.flight=5          # ordering preserved with idempotence off
#   enable.idempotence=true  # turn on for payment topics (single-partition keys)
#
# Consumer-side (telemetry-ingest etc.):
#   fetch.min.bytes=65536    # batch fetches
#   fetch.max.wait.ms=500
#   max.poll.records=1000
#   isolation.level=read_committed   # if transactions are introduced later
# =============================================================================
