# H2Fleet PWA — SPA + APISIX reverse proxy (SPEC §3.6).
# Build-time configurable upstream: docker build --build-arg is not used; override
# APISIX_HOST via envsubst-friendly template if needed. Default: apisix:9080.
upstream apisix {
    server apisix:9080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets: long cache.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API traffic goes to APISIX, preserving the /api prefix.
    location /api/ {
        proxy_pass http://apisix;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Service worker + manifest must never be cached aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires 0;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (offline shell handled by the service worker).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
