# H2Fleet PWA — SPA + APISIX reverse proxy (SPEC §3.6).
# Cache-busting contract (deployment correctness):
#   * index.html / SPA fallback / manifest / service worker: NEVER cached
#     (no-cache, no-store, must-revalidate; etag off for html) so a deploy is
#     visible immediately and the SW can always detect a new version.
#   * /assets/** (Vite content-hashed files): immutable, 1-year cache.
# The APISIX edge must not re-add caching for /index.html — see the
# response-rewrite snippet in the platform-assurance report / docs.
upstream apisix {
    server apisix:9080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Entry document: never cache, never store, no etag validator. A stale
    # index.html is the #1 cause of "deploy didn't take" — it pins hashed
    # asset URLs and the SW version.
    location = /index.html {
        etag off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Service worker + manifest must never be cached aggressively: the browser
    # re-fetches sw.js byte-for-byte to detect updates only when it isn't
    # served from cache.
    location = /sw.js {
        etag off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Hashed build assets: long cache (Vite content-hashes every filename;
    # safe to mark immutable for a year).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API traffic goes to APISIX, preserving the /api prefix.
    location /api/ {
        proxy_pass http://apisix;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback (offline shell handled by the service worker). The fallback
    # serves index.html, so it carries the same no-store contract.
    location / {
        etag off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
