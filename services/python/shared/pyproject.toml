[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h2fleet-auth"
version = "0.1.0"
description = "Shared Keycloak OIDC JWT (RS256) FastAPI dependency for H2Fleet Python services (SPEC.md §3.5)"
requires-python = ">=3.11"
dependencies = [
    "PyJWT[crypto]>=2.13,<3",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
]

[tool.setuptools.packages.find]
include = ["h2fleet_auth*"]
