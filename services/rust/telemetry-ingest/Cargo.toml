[package]
name = "telemetry-ingest"
version = "0.1.0"
edition = "2021"
description = "H2Fleet telemetry.ingest: Kafka consumer -> validation/enrichment -> TimescaleDB + telemetry.enriched republish"

[dependencies]
tokio = { version = "1", features = ["full"] }
rdkafka = { version = "0.37", features = ["cmake-build", "tokio"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
