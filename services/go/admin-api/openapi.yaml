openapi: 3.0.3
info:
  title: H2Fleet admin-api
  version: 0.1.0
  description: >-
    Admin & onboarding backend: stakeholder onboarding with Keycloak
    provisioning, platform user management, unified cross-service KPI
    aggregation and the NOC/SOC operations feed. Gateway prefix /api/admin/*
    (proxy-rewrite strips the prefix). Errors use the shared envelope
    {"error": "<message>"}.
servers:
  - url: http://admin-api:8085
tags:
  - name: onboarding
  - name: users
  - name: admin
  - name: meta
paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness/readiness probe (pings Postgres)
      operationId: healthz
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Postgres unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/onboarding/citizen:
    post:
      tags: [onboarding]
      summary: Citizen self-serve registration (public)
      operationId: citizenSelfServe
      description: >-
        Validates the intake, provisions the Keycloak user with realm role
        `citizen`, sets a temporary password, sends the VERIFY_EMAIL +
        UPDATE_PASSWORD actions email and records status=completed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingIntake' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/onboarding/{persona}:
    post:
      tags: [onboarding]
      summary: Public onboarding intake (status=pending)
      operationId: onboardingIntake
      parameters:
        - name: persona
          in: path
          required: true
          schema:
            type: string
            enum: [driver, operator, station-staff, advertiser, data-partner, gov-viewer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingIntake' }
      responses:
        '201':
          description: Intake recorded with status=pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/OnboardingRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/onboarding:
    get:
      tags: [onboarding]
      summary: List onboarding requests (platform-admin or operator)
      operationId: listOnboarding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, completed] }
        - name: persona
          in: query
          schema:
            type: string
            enum: [citizen, driver, operator, station-staff, advertiser, data-partner, gov-viewer]
      responses:
        '200':
          description: Filtered requests (newest first, max 100)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/OnboardingRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/onboarding/{id}:
    get:
      tags: [onboarding]
      summary: Get one onboarding request (platform-admin or operator)
      operationId: getOnboarding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/OnboardingRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/onboarding/{id}/approve:
    post:
      tags: [onboarding]
      summary: Approve a pending request (platform-admin ONLY)
      operationId: approveOnboarding
      description: >-
        Provisions the Keycloak user with the persona's mapped realm role
        (citizen->citizen, driver->driver, operator->operator,
        station-staff->operator, advertiser/data-partner/gov-viewer->citizen),
        sets a temporary password, sends VERIFY_EMAIL + UPDATE_PASSWORD and
        marks the request completed.
        Restricted to platform-admin: operators may list/view requests but can
        never approve (an operator must not be able to mint further operator
        accounts — SECURITY_AUDIT F3).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Completed request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/OnboardingRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/onboarding/{id}/reject:
    post:
      tags: [onboarding]
      summary: Reject a pending request (platform-admin ONLY)
      operationId: rejectOnboarding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Stored in meta.reject_reason }
      responses:
        '200':
          description: Rejected request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/OnboardingRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/users:
    get:
      tags: [users]
      summary: List users with realm roles (platform-admin)
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
    post:
      tags: [users]
      summary: Create a user (platform-admin)
      operationId: createUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                roles:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created (actions email sent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/users/{id}/roles:
    put:
      tags: [users]
      summary: Replace a user's realm roles (platform-admin)
      operationId: updateUserRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { type: string }
      responses:
        '204': { description: Roles replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/users/{id}/disable:
    post:
      tags: [users]
      summary: Disable a user (platform-admin)
      operationId: disableUser
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Disabled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/users/{id}/enable:
    post:
      tags: [users]
      summary: Re-enable a user (platform-admin)
      operationId: enableUser
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Enabled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/users/{id}/reset-password:
    post:
      tags: [users]
      summary: Send a password-reset actions email (platform-admin)
      operationId: resetUserPassword
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Email sent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/admin/kpis:
    get:
      tags: [admin]
      summary: Unified platform KPIs for the admin console (platform-admin or operator)
      operationId: unifiedKpis
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: >-
            Cross-service rollup. Failed sources are named in `degraded` and
            `partial` is true; every section is independently nullable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnifiedKpis' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/ops/health:
    get:
      tags: [admin]
      summary: NOC/SOC service health matrix (platform-admin or operator)
      operationId: opsHealth
      description: >-
        Sweeps every service /healthz in parallel (2s per-service timeout) and
        joins with the latest Alertmanager alerts. `overall` is `ok` only when
        every service responds healthy; per-service `degraded` marks DB-ping
        failures.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Health matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/ops/alerts:
    get:
      tags: [admin]
      summary: Active Alertmanager alerts, proxy (platform-admin or operator)
      operationId: opsAlerts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: admin-api }
        db: { type: string, example: ok, description: 'ok | degraded (ping failed)' }
    OnboardingIntake:
      type: object
      required: [email, display_name]
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        org: { type: string, default: '' }
        meta: { type: object, additionalProperties: true }
    OnboardingRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        persona: { type: string }
        email: { type: string }
        display_name: { type: string }
        org: { type: string }
        status: { type: string, enum: [pending, approved, rejected, completed] }
        keycloak_sub: { type: string }
        meta: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        decided_by: { type: string }
    OnboardingCreated:
      type: object
      properties:
        id: { type: string, description: Keycloak user id }
        sub: { type: string, description: Keycloak subject (same as id) }
        persona: { type: string }
        email: { type: string }
        status: { type: string, example: completed }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        roles:
          type: array
          items: { type: string }
    UnifiedKpis:
      type: object
      properties:
        fleet:
          type: object
          nullable: true
          properties:
            vehicles_total: { type: integer }
            vehicles_active: { type: integer }
        stations:
          type: object
          nullable: true
          properties:
            stations_total: { type: integer }
            stations_online: { type: integer }
            available_kg_total: { type: number }
        payments:
          type: object
          nullable: true
          properties:
            payments_30d: { type: integer }
            settled_minor_30d: { type: integer }
        carbon:
          type: object
          nullable: true
          properties:
            kg_co2_avoided_total: { type: number }
        incidents:
          type: object
          nullable: true
          properties:
            open: { type: integer }
            open_critical: { type: integer }
        compliance:
          type: object
          nullable: true
          properties:
            reports_total: { type: integer }
            latest_at: { type: string, format: date-time, nullable: true }
        toggles:
          type: object
          nullable: true
          properties:
            toggles_total: { type: integer }
            toggles_enabled: { type: integer }
        partial: { type: boolean }
        degraded:
          type: array
          items: { type: string }
    OpsHealth:
      type: object
      properties:
        overall: { type: string, enum: [ok, degraded] }
        services:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string, enum: [healthy, degraded, down] }
              db: { type: string, nullable: true }
              error: { type: string, nullable: true }
        alerts_active: { type: integer }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
    Alert:
      type: object
      properties:
        name: { type: string }
        severity: { type: string }
        service: { type: string }
        starts_at: { type: string }
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing/invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing realm role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State conflict (e.g. request already decided)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: Downstream failure (Keycloak Admin API / Alertmanager)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      type: object
      properties:
        error: { type: string }
