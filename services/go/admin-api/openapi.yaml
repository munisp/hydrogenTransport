openapi: 3.0.3
info:
  title: H2Fleet admin-api
  version: 0.1.0
  description: >-
    Admin & onboarding backend: stakeholder onboarding with Keycloak
    provisioning, platform user management, unified cross-service KPI
    aggregation and the NOC/SOC operations feed. Gateway prefix /api/admin/*
    (proxy-rewrite strips the prefix). Errors use the shared envelope
    {"error": "<message>"}.
servers:
  - url: http://admin-api:8085
tags:
  - name: onboarding
  - name: users
  - name: admin
  - name: meta
paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness/readiness probe (pings Postgres)
      operationId: healthz
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Postgres unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/onboarding/citizen:
    post:
      tags: [onboarding]
      summary: Citizen self-serve registration (public)
      operationId: citizenSelfServe
      description: >-
        Validates the intake, provisions the Keycloak user with realm role
        `citizen`, sets a temporary password, sends the VERIFY_EMAIL +
        UPDATE_PASSWORD actions email and records status=completed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingIntake' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/onboarding/{persona}:
    post:
      tags: [onboarding]
      summary: Public onboarding intake (status=pending)
      operationId: onboardingIntake
      parameters:
        - name: persona
          in: path
          required: true
          schema:
            type: string
            enum: [driver, operator, station-staff, advertiser, data-partner, gov-viewer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingIntake' }
      responses:
        '201':
          description: Intake recorded with status=pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/OnboardingRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/onboarding:
    get:
      tags: [onboarding]
      summary: List onboarding requests (platform-admin or operator)
      operationId: listOnboarding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, completed] }
        - name: persona
          in: query
          schema:
            type: string
            enum: [citizen, driver, operator, station-staff, advertiser, data-partner, gov-viewer]
      responses:
        '200':
          description: Filtered requests (newest first, max 100)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/OnboardingRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/onboarding/{id}:
    get:
      tags: [onboarding]
      summary: Get one onboarding request (platform-admin or operator)
      operationId: getOnboarding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/OnboardingRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/onboarding/{id}/approve:
    post:
      tags: [onboarding]
      summary: Approve a pending request (platform-admin ONLY)
      operationId: approveOnboarding
      description: >-
        Provisions the Keycloak user with the persona's mapped realm role
        (citizen->citizen, driver->driver, operator->operator,
        station-staff->operator, advertiser/data-partner/gov-viewer->citizen),
        sets a temporary password, sends VERIFY_EMAIL + UPDATE_PASSWORD and
        marks the request completed.
        Restricted to platform-admin: operators may list/view requests but can
        never approve (an operator must not be able to mint further operator
        accounts — SECURITY_AUDIT F3).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Completed request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/OnboardingRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/onboarding/{id}/reject:
    post:
      tags: [onboarding]
      summary: Reject a pending request (platform-admin ONLY)
      operationId: rejectOnboarding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Stored in meta.reject_reason }
      responses:
        '200':
          description: Rejected request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/OnboardingRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/users:
    get:
      tags: [users]
      summary: List users with realm roles (platform-admin)
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
    post:
      tags: [users]
      summary: Create a user (platform-admin)
      operationId: createUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                roles:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created (actions email sent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/users/{id}/roles:
    put:
      tags: [users]
      summary: Assign/revoke realm roles (platform-admin)
      operationId: updateUserRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  type: array
                  items: { type: string }
                remove:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Roles updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  added: { type: array, items: { type: string } }
                  removed: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/users/{id}/disable:
    post:
      tags: [users]
      summary: Disable a user (platform-admin)
      operationId: disableUser
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  enabled: { type: boolean, enum: [false] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/users/{id}/enable:
    post:
      tags: [users]
      summary: Enable a user (platform-admin)
      operationId: enableUser
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  enabled: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/users/{id}/reset-password:
    post:
      tags: [users]
      summary: Send password-reset actions email (platform-admin)
      operationId: resetPassword
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/admin/kpis:
    get:
      tags: [admin]
      summary: Unified cross-service KPI aggregation (platform-admin or operator)
      operationId: getKpis
      description: >-
        Server-side fan-out (3s per-source timeout). Failed sources degrade
        partially: their section is null and named in meta.degraded.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Aggregated KPIs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/health:
    get:
      tags: [admin]
      summary: Health sweep of all services + middleware (platform-admin or operator)
      operationId: getHealth
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sweep results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthSweep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/alerts:
    get:
      tags: [admin]
      summary: Active alerts (Alertmanager proxy; explicit degraded envelope on failure)
      operationId: getAlerts
      description: >-
        Proxies Alertmanager /api/v2/alerts verbatim. When Alertmanager is
        unreachable or errors, returns {"alerts": [], "degraded": true,
        "source": "alertmanager"} so an outage is never mistaken for "no
        active alerts".
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Alertmanager /api/v2/alerts payload (verbatim), or the
            degraded envelope when Alertmanager is unavailable
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { type: object }
                  - type: object
                    properties:
                      alerts:
                        type: array
                        items: { type: object }
                      degraded: { type: boolean }
                      source: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/toggles:
    get:
      tags: [admin]
      summary: Enriched feature-toggle list (platform-admin or operator)
      operationId: listAdminToggles
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Toggles with domain + owning services
          content:
            application/json:
              schema:
                type: object
                properties:
                  toggles:
                    type: array
                    items: { $ref: '#/components/schemas/ToggleView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /v1/admin/toggles/{module}:
    put:
      tags: [admin]
      summary: Flip a module toggle (platform-admin; proxied to toggle-service with caller JWT)
      operationId: updateAdminToggle
      security: [{ bearerAuth: [] }]
      parameters:
        - name: module
          in: path
          required: true
          schema: { type: string, description: One of the 20 module ids (SPEC §3.1) }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: toggle-service response (proxied)
          content:
            application/json:
              schema:
                type: object
                properties:
                  module: { type: string }
                  enabled: { type: boolean }
                  domain: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, unhealthy] }
    Error:
      type: object
      properties:
        error: { type: string }
    OnboardingIntake:
      type: object
      required: [email, display_name]
      properties:
        email: { type: string, format: email }
        display_name: { type: string, maxLength: 120 }
        org: { type: string, maxLength: 200 }
        meta: { type: object }
    OnboardingRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        persona:
          type: string
          enum: [citizen, driver, operator, station-staff, advertiser, data-partner, gov-viewer]
        email: { type: string }
        display_name: { type: string }
        org: { type: string }
        status: { type: string, enum: [pending, approved, rejected, completed] }
        keycloak_sub: { type: string, description: Keycloak user id once provisioned }
        meta: { type: object }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        decided_by: { type: string, description: JWT sub of the approver, or "self-service" }
    OnboardingCreated:
      type: object
      properties:
        request: { $ref: '#/components/schemas/OnboardingRequest' }
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        enabled: { type: boolean }
        roles:
          type: array
          items: { type: string }
    KpiResponse:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        fleet:
          nullable: true
          type: object
          properties:
            vehicles_total: { type: integer }
            vehicles_available: { type: integer }
            telemetry_points_per_min: { type: number }
        infra:
          nullable: true
          type: object
          properties:
            open_incidents: { type: integer }
        citizen:
          nullable: true
          type: object
          properties:
            drt_requests_today: { type: integer }
            carbon_kg_co2_total: { type: number }
        commerce:
          nullable: true
          type: object
          properties:
            payments_30d: { type: integer }
            revenue_30d_minor: { type: integer, format: int64 }
            currency: { type: string }
        toggles:
          nullable: true
          type: object
          properties:
            modules_enabled: { type: integer }
            modules_total: { type: integer }
            domains:
              type: object
              additionalProperties:
                type: object
                properties:
                  enabled: { type: integer }
                  total: { type: integer }
        meta:
          type: object
          properties:
            partial: { type: boolean }
            degraded:
              type: array
              items: { type: string, enum: [fleet, infra, citizen, commerce, toggles] }
    HealthSweep:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string, enum: [http, tcp] }
              target: { type: string }
              status: { type: string, enum: [up, down] }
              latency_ms: { type: integer, format: int64 }
        summary:
          type: object
          properties:
            up: { type: integer }
            down: { type: integer }
    ToggleView:
      type: object
      properties:
        module: { type: string }
        domain: { type: string, enum: [fleet, infra, citizen, commerce, unknown] }
        enabled: { type: boolean }
        owning_services:
          type: array
          items: { type: string }
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing/invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing required realm role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request already decided
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: Upstream (Keycloak / toggle-service) failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
