openapi: 3.0.3
info:
  title: H2Fleet citizen-api
  version: 0.1.0
  description: >-
    Domain 3 (Citizen & Engagement) API: passenger info, mobile bootstrap,
    demand-responsive transport, carbon credits and the open-data portal.
    Module-gated routes return 404 when their module toggle is OFF (SPEC §3.2).
servers:
  - url: http://citizen-api:8083
tags:
  - name: passenger-pwa
  - name: mobile-app
  - name: demand-responsive
  - name: carbon-credits
  - name: open-data-portal
  - name: meta
paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness/readiness probe
      operationId: healthz
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '503': { $ref: '#/components/responses/HealthDegraded' }
  /v1/passenger/stops:
    get:
      tags: [passenger-pwa]
      summary: List stops
      operationId: listStops
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/passenger/routes:
    get:
      tags: [passenger-pwa]
      summary: List routes
      operationId: listRoutes
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/passenger/arrivals:
    get:
      tags: [passenger-pwa]
      summary: Upcoming arrivals (optionally per stop)
      operationId: getArrivals
      parameters:
        - name: stop_id
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/passenger/journey:
    get:
      tags: [passenger-pwa]
      summary: Plan a journey
      operationId: planJourney
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/passenger/alerts:
    get:
      tags: [passenger-pwa]
      summary: Active service alerts
      operationId: listAlerts
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/mobile/config:
    get:
      tags: [mobile-app]
      summary: Bootstrap config for the Expo apps (module states, endpoints)
      operationId: mobileConfig
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/drt/requests:
    post:
      tags: [demand-responsive]
      summary: Request an on-demand shuttle (JWT)
      operationId: createDRTRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup]
              properties:
                pickup:
                  type: object
                  required: [lat, lon]
                  properties:
                    lat: { type: number }
                    lon: { type: number }
                dropoff:
                  type: object
                  properties:
                    lat: { type: number }
                    lon: { type: number }
                pickup_label: { type: string }
                dropoff_label: { type: string }
                passengers: { type: integer, minimum: 1, maximum: 20, default: 1 }
      responses:
        '201':
          description: Created DRT request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DRTRequest' }
        '400':
          description: pickup {lat,lon} missing, or passengers outside 1..20
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    get:
      tags: [demand-responsive]
      summary: List own DRT requests (JWT)
      operationId: listDRTRequests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Request list
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/DRTRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/drt/requests/{id}:
    get:
      tags: [demand-responsive]
      summary: Get one DRT request (JWT)
      operationId: getDRTRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: DRT request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DRTRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Request not found or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/drt/requests/{id}/cancel:
    post:
      tags: [demand-responsive]
      summary: Cancel a DRT request (JWT)
      description: Only the rider who created the request may cancel it;
        callers with the operator or platform-admin realm role may cancel any
        request. Non-owners receive 404 (not 403) so request existence is not
        leaked.
      operationId: cancelDRTRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cancelled request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DRTRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Request not found, owned by another rider, or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Request not cancellable in its current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/drt/requests/{id}/assign:
    post:
      tags: [demand-responsive]
      summary: >-
        Assign a requested ride to a vehicle (operator role): requested →
        assigned, stamping vehicle_id/driver_sub/assigned_at. Publishes
        drt.assigned.
      operationId: assignDRTRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id]
              properties:
                vehicle_id: { type: string, format: uuid }
                driver_sub: { type: string }
      responses:
        '200':
          description: Assigned request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DRTRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: Request not found or not in requested status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: vehicle_id does not reference a known vehicle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/drt/requests/{id}/start:
    post:
      tags: [demand-responsive]
      summary: "Start an assigned ride (driver|operator role): assigned → enroute"
      operationId: startDRTRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Enroute request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DRTRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: Request not found or not in assigned status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/drt/requests/{id}/complete:
    post:
      tags: [demand-responsive]
      summary: "Complete an enroute ride (driver|operator role): enroute → completed"
      operationId: completeDRTRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Completed request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DRTRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: Request not found or not in enroute status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/opendata/gtfs:
    get:
      tags: [open-data-portal]
      summary: >-
        Full GTFS static feed as one zip archive (stops.txt, routes.txt,
        trips.txt, stop_times.txt, frequencies.txt), built from the live
        timetable data
      operationId: gtfsZip
      responses:
        '200':
          description: GTFS zip archive
          content:
            application/zip: {}
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/opendata/gtfs/{file}:
    get:
      tags: [open-data-portal]
      summary: One GTFS CSV file from the static feed
      operationId: gtfsFile
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            enum: [stops.txt, routes.txt, trips.txt, stop_times.txt, frequencies.txt]
      responses:
        '200':
          description: GTFS CSV content
          content:
            text/csv: {}
        '404':
          description: Unknown GTFS file or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/carbon/credits:
    get:
      tags: [carbon-credits]
      summary: List issued carbon credits
      operationId: listCarbonCredits
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/carbon/credits/summary:
    get:
      tags: [carbon-credits]
      summary: CO2 avoided / credit totals
      operationId: carbonSummary
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/opendata/datasets:
    get:
      tags: [open-data-portal]
      summary: List open datasets
      operationId: listDatasets
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/opendata/search:
    get:
      tags: [open-data-portal]
      summary: Search datasets via OpenSearch
      operationId: searchOpenData
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '502':
          description: OpenSearch upstream unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    DRTRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_sub: { type: string, description: Owning rider's JWT subject }
        pickup_lat: { type: number }
        pickup_lon: { type: number }
        dropoff_lat: { type: number }
        dropoff_lon: { type: number }
        pickup_label: { type: string, description: Human-readable pickup label (free text) }
        dropoff_label: { type: string, description: Human-readable dropoff label (free text) }
        passengers: { type: integer, minimum: 1, maximum: 20 }
        vehicle_id: { type: string, format: uuid, description: Set once assigned }
        driver_sub: { type: string, description: Assigned driver's subject }
        assigned_at: { type: string, format: date-time }
        status: { type: string, enum: [requested, assigned, enroute, completed, cancelled] }
        requested_at: { type: string, format: date-time }
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    JsonOk:
      description: Successful JSON response
      content:
        application/json:
          schema: { type: object }
    HealthOk:
      description: Service healthy
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Health' }
    HealthDegraded:
      description: Postgres unreachable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Health' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacking the required realm role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ModuleDisabled:
      description: The module toggle for this route is OFF (SPEC §3.2)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
