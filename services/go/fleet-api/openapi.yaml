openapi: 3.0.3
info:
  title: H2Fleet fleet-api
  version: 0.1.0
  description: >-
    Domain 1 (Fleet Operations & Telematics) API: vehicles, telemetry queries,
    maintenance predictions and fuel levels. Module-gated routes return 404
    when their module toggle is OFF (SPEC §3.2). Digital-twin and
    route-optimizer calls go directly to those services via APISIX
    (/api/twin/*, /api/optimize/*) — the former fleet-api proxy routes were
    removed as orphans (docs/BUSINESS_LOGIC_AUDIT.md).
servers:
  - url: http://fleet-api:8081
tags:
  - name: telematics
  - name: predictive-maintenance
  - name: fuel-monitoring
  - name: meta
paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness/readiness probe
      operationId: healthz
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '503': { $ref: '#/components/responses/HealthDegraded' }
  /v1/vehicles:
    get:
      tags: [telematics]
      summary: List vehicles
      operationId: listVehicles
      responses:
        '200':
          description: Vehicle list
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicles:
                    type: array
                    items: { $ref: '#/components/schemas/Vehicle' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/telemetry/latest:
    get:
      tags: [telematics]
      summary: Latest telemetry reading per vehicle
      operationId: latestTelemetry
      responses:
        '200':
          description: Latest rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  telemetry:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryRow' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/maintenance/predictions:
    get:
      tags: [predictive-maintenance]
      summary: Latest failure-risk predictions
      operationId: listPredictions
      parameters:
        - name: bus_id
          in: query
          schema: { type: string, format: uuid }
        - name: min_risk
          in: query
          description: Inclusive lower bound on risk_score (0..1)
          schema: { type: number, minimum: 0, maximum: 1 }
      responses:
        '400':
          description: Invalid min_risk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200':
          description: Prediction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  predictions:
                    type: array
                    items: { $ref: '#/components/schemas/Prediction' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/fuel/levels:
    get:
      tags: [fuel-monitoring]
      summary: Current H2 tank levels per vehicle
      operationId: listFuelLevels
      responses:
        '200':
          description: Fuel levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: array
                    items: { $ref: '#/components/schemas/FuelLevel' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  schemas:
    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        fleet_no: { type: string }
        vin: { type: string }
        model: { type: string }
        h2_capacity_kg: { type: number }
        status: { type: string }
    TelemetryRow:
      type: object
      properties:
        bus_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        speed_kph: { type: number }
        h2_level_pct: { type: number }
        fuel_cell_kw: { type: number }
        battery_soc_pct: { type: number }
        odometer_km: { type: number }
    Prediction:
      type: object
      properties:
        bus_id: { type: string, format: uuid }
        component: { type: string }
        risk: { type: number }
        model_version: { type: string }
    FuelLevel:
      type: object
      properties:
        bus_id: { type: string, format: uuid }
        fleet_no: { type: string }
        h2_level_pct: { type: number }
        h2_remaining_kg: { type: number, description: level% × vehicle h2_capacity_kg }
        estimated_range_km: { type: number, description: remaining kg × 100 / consumption rate }
        consumption_kg_per_100km:
          type: number
          description: Rate behind the range estimate (learned from fuel.reading telemetry, else the fleet-wide default 8.0)
        consumption_source: { type: string, enum: [learned, default] }
        measured_at: { type: string, format: date-time }
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    HealthOk:
      description: Service healthy
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Health' }
    HealthDegraded:
      description: Dependency unreachable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Health' }
    ModuleDisabled:
      description: The module toggle for this route is OFF (SPEC §3.2)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Internal error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
