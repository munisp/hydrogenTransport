openapi: 3.0.3
info:
  title: H2Fleet commerce-api
  version: 0.1.0
  description: >-
    Domain 4 (Commerce & Finance) API: fare payments (Mojaloop rails +
    TigerBeetle ledger), loyalty marketplace, energy trading, government KPIs
    and advertising. Module-gated routes return 404 when their module toggle
    is OFF (SPEC §3.2).
servers:
  - url: http://commerce-api:8084
tags:
  - name: fare-payments
  - name: loyalty-marketplace
  - name: energy-trading
  - name: gov-dashboard
  - name: advertising
  - name: meta
paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness/readiness probe
      operationId: healthz
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '503': { $ref: '#/components/responses/HealthDegraded' }
  /v1/payments:
    post:
      tags: [fare-payments]
      summary: >-
        Initiate a fare payment (JWT); publishes fare.payment.initiated /
        fare.payment.settled. The paying rider is ALWAYS the authenticated JWT
        subject. The body's rider_sub is kept for backwards compatibility but
        is ignored for ledger/account operations; a rider_sub that does not
        match the JWT subject is rejected with 403. Daily fare capping
        (FARE_DAILY_CAP_MINOR, default 800 minor = €8.00; 0 disables): once
        today's settled charges reach the cap, further rides settle at
        charged_minor = 0 while the requested amount_minor is still recorded.
      operationId: createPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: integer, minimum: 1, description: Amount in minor units (cents) }
                currency: { type: string, default: EUR }
                rider_sub:
                  type: string
                  description: >-
                    DEPRECATED/ignored: the rider is derived from the JWT
                    subject. A value not matching the JWT subject yields 403.
                use_mojaloop:
                  type: boolean
                  default: false
                  description: >-
                    Run the Mojaloop settlement leg; fails closed as
                    mojaloop_unavailable when MOJALOOP_ENDPOINT is unset unless
                    H2_SIMULATED_MOJALOOP=true (dev opt-in)
      responses:
        '200':
          description: Idempotent replay of an existing payment (same Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '201':
          description: Settled payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: >-
            Rider wallet provisioned but unfunded (error code
            insufficient_funds). Top up via POST /v1/wallets/topup in
            dev/simulated environments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: rider_sub does not match the authenticated JWT subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '502':
          description: Ledger/Mojaloop upstream failure (fare.payment.failed published)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [fare-payments]
      summary: List own payments (JWT)
      operationId: listPayments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/payments/{id}/refund:
    post:
      tags: [fare-payments]
      summary: >-
        Fully refund a settled payment (operator role). Reversal transfer
        operator revenue → rider wallet for the charged (post-capping)
        amount, loyalty points clawed back, fare.payment.refunded published.
        Retries are idempotent (deterministic reversal transfer id); a fully
        capped 0-charged payment refunds without a ledger posting.
      operationId: refundPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Refunded payment (also the idempotent replay of an already-refunded payment)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Payment not found or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Only settled payments can be refunded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/payments/{id}:
    get:
      tags: [fare-payments]
      summary: Get one payment (JWT)
      operationId: getPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Payment not found or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/wallets/topup:
    post:
      tags: [fare-payments]
      summary: >-
        Dev/simulated wallet funding (JWT). Credits the caller's own rider
        wallet from the platform cash-in account; the wallet
        (commerce.rider_accounts + TigerBeetle account) is provisioned lazily
        on first use. Enabled by default only with the simulated ledger
        (H2_SIMULATED_LEDGER=true) or WALLET_TOPUP_ENABLED=true; pending a
        real Mojaloop cash-in flow.
      operationId: topUpWallet
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: integer, minimum: 1, maximum: 1000000 }
      responses:
        '201': { $ref: '#/components/responses/JsonOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Top-up disabled (production default) or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/loyalty/balance:
    get:
      tags: [loyalty-marketplace]
      summary: >-
        Own loyalty points balance (JWT) from commerce.loyalty_accounts;
        the account is created lazily (0 points) for new riders. Points
        accrue at 1 point per full €1 of settled fare payment.
      operationId: getLoyaltyBalance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Loyalty balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/loyalty/redeem:
    post:
      tags: [loyalty-marketplace]
      summary: >-
        Redeem an offer with points (JWT). One atomic SQL transaction:
        balance check + decrement + redemption record. Idempotent on the
        Idempotency-Key header (falling back to offer_id + subject): retries
        return the original redemption without double-deducting.
      operationId: redeemOffer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offer_id]
              properties:
                offer_id: { type: string, format: uuid }
      responses:
        '200':
          description: Redemption (or its idempotent replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Redemption' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Insufficient loyalty points
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Offer not found/inactive or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Idempotency key already used with different redemption parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/marketplace/offers:
    get:
      tags: [loyalty-marketplace]
      summary: List marketplace offers
      operationId: listOffers
      responses:
        '200': { $ref: '#/components/responses/JsonOk' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    post:
      tags: [loyalty-marketplace]
      summary: Create an offer (operator role)
      operationId: createOffer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                partner: { type: string }
                cost_points: { type: integer, minimum: 1 }
      responses:
        '201': { $ref: '#/components/responses/JsonOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/energy/trades:
    get:
      tags: [energy-trading]
      summary: List energy trades
      operationId: listTrades
      responses:
        '200':
          description: Trade list
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items: { $ref: '#/components/schemas/Trade' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    post:
      tags: [energy-trading]
      summary: >-
        Execute an energy trade (operator role, Idempotency-Key required).
        Flow: proposed row (idempotent on the key) → physical backing check
        (sale kinds draw down station surplus — infra.stations.available_kg
        for the H2 kinds, available_kwh for ev-v2g-export; a trade exceeding
        the recorded surplus is rejected) → TigerBeetle settlement (energy
        clearing 3001 → operator revenue 2001 for sale/export kinds, reverse
        for purchase kinds; deterministic transfer id).
        The clearing account is overdraft-protected: an unfunded trade lands
        in failed with energy.trade.failed (never cleared). On success the
        trade becomes executed with tb_transfer_id persisted and
        energy.trade.executed is published.
        Wave 5 kinds: ev-v2g-export (fleet sells kWh to the grid — draws
        available_kwh like h2-sale draws available_kg) and ev-charge-purchase
        (inbound charging purchase — funds clearing like h2-purchase).
        quantity_kg carries kWh for the ev-* kinds (column name kept for
        backward compatibility; the kind names the unit).
      operationId: createTrade
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, quantity_kg, price_minor]
              properties:
                kind: { type: string, enum: [h2-sale, h2-purchase, energy-export, ev-v2g-export, ev-charge-purchase] }
                quantity_kg: { type: number, exclusiveMinimum: 0, description: Traded amount — kg for H2 kinds, kWh for ev-* kinds }
                price_minor: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Idempotent replay of an existing trade (same Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '201':
          description: Executed trade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Energy clearing account unfunded (error code insufficient_funds; trade marked failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: Trade quantity exceeds recorded station H2 surplus (error code insufficient_surplus; trade marked failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Ledger upstream failure (trade marked failed, energy.trade.failed published)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/energy/trades/{id}/cancel:
    post:
      tags: [energy-trading]
      summary: >-
        Cancel a proposed trade (operator role). Only proposed trades can be
        cancelled — a proposed trade has not drawn surplus and not settled,
        so cancellation is a pure status flip (executed/failed are terminal).
        Publishes energy.trade.cancelled.
      operationId: cancelTrade
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cancelled trade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trade' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '409':
          description: Trade not found or not in proposed status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/gov/kpis:
    get:
      tags: [gov-dashboard]
      summary: >-
        City KPI snapshot (cost, emissions, ridership, fleet, stations,
        incidents). Honest degradation: each rollup is independent — a
        failed source leaves its fields null and is named in `degraded`
        (never a fabricated value). `fleet_uptime_pct` is null until a
        time-based availability source exists; the static status mix is
        `fleet_active_ratio_pct`. `open_incidents` includes in_progress.
      operationId: getGovKPIs
      responses:
        '200':
          description: KPI snapshot (partially null when degraded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovKPIs' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/ads/campaigns:
    get:
      tags: [advertising]
      summary: List ad campaigns
      operationId: listCampaigns
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, paused, ended] }
      responses:
        '200':
          description: Campaign list
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    post:
      tags: [advertising]
      summary: >-
        Create a campaign (operator role). Validated: name required
        (trimmed, 1-200 chars), budget_minor must not be negative, ends_at
        must not precede starts_at.
      operationId: createCampaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                advertiser: { type: string }
                budget_minor: { type: integer, minimum: 0 }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
      responses:
        '201':
          description: Created campaign (starts in draft)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
  /v1/ads/campaigns/{id}:
    get:
      tags: [advertising]
      summary: Get one campaign
      operationId: getCampaign
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404':
          description: Campaign not found or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [advertising]
      summary: >-
        Update a campaign's status (operator role). Lifecycle is enforced:
        draft → active|ended, active → paused|ended, paused → active|ended,
        ended is terminal. Illegal transitions (e.g. ended → active) → 409.
      operationId: updateCampaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, active, paused, ended] }
      responses:
        '200':
          description: Updated campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Campaign not found or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Invalid status transition (ended campaigns are terminal)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/ads/inventory:
    get:
      tags: [advertising]
      summary: List ad inventory slots
      operationId: listAdInventory
      parameters:
        - name: kind
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Inventory list
          content:
            application/json:
              schema:
                type: object
                properties:
                  inventory:
                    type: array
                    items: { $ref: '#/components/schemas/AdInventory' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    post:
      tags: [advertising]
      summary: Create an ad inventory slot (operator role)
      operationId: createAdInventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, label]
              properties:
                kind: { type: string }
                bus_id: { type: string, format: uuid }
                label: { type: string }
      responses:
        '201':
          description: Created inventory slot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdInventory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
        '422':
          description: bus_id does not reference a known vehicle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/ads/placements:
    get:
      tags: [advertising]
      summary: List ad placements
      operationId: listAdPlacements
      parameters:
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: inventory_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Placement list
          content:
            application/json:
              schema:
                type: object
                properties:
                  placements:
                    type: array
                    items: { $ref: '#/components/schemas/AdPlacement' }
        '404': { $ref: '#/components/responses/ModuleDisabled' }
    post:
      tags: [advertising]
      summary: >-
        Book a placement (operator role). Enforced: committed placement cost
        + this cost must not exceed the campaign budget (409
        budget_exceeded); no overlapping booking of the same inventory slot
        (409 slot_already_booked); ended campaigns cannot take placements.
      operationId: createAdPlacement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, inventory_id, starts_at, ends_at, cost_minor]
              properties:
                campaign_id: { type: string, format: uuid }
                inventory_id: { type: string, format: uuid }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                cost_minor: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Booked placement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdPlacement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Campaign or inventory slot not found, or module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: budget_exceeded, slot_already_booked, or campaign ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen idempotency key; retries replay the original operation
      schema: { type: string }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Idempotency key; defaults to offer_id + authenticated subject
      schema: { type: string }
  schemas:
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        rider_sub: { type: string, description: Always the authenticated JWT subject }
        amount_minor: { type: integer, description: Requested fare }
        charged_minor:
          type: integer
          nullable: true
          description: >-
            Amount actually debited after daily fare capping (null on
            pre-capping rows — treat as equal to amount_minor)
        currency: { type: string }
        mojaloop_transfer_id: { type: string }
        tb_transfer_id: { type: string }
        idempotency_key: { type: string }
        status: { type: string, enum: [initiated, settled, failed, refunded, mojaloop_failed] }
        created_at: { type: string, format: date-time }
    Trade:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [h2-sale, h2-purchase, energy-export, ev-v2g-export, ev-charge-purchase] }
        quantity_kg: { type: number, description: Traded amount — kg for H2 kinds, kWh for ev-* kinds }
        price_minor: { type: integer }
        status: { type: string, enum: [proposed, executed, failed, cancelled] }
        tb_transfer_id: { type: string, description: TigerBeetle transfer id (set once executed) }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        advertiser: { type: string }
        budget_minor: { type: integer }
        committed_minor: { type: integer, description: Sum of booked placement costs }
        remaining_budget_minor: { type: integer, description: budget_minor − committed_minor }
        status: { type: string, enum: [draft, active, paused, ended] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    AdInventory:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: Slot kind (e.g. side-panel, interior-screen) }
        bus_id: { type: string, format: uuid }
        label: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    AdPlacement:
      type: object
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        inventory_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        cost_minor: { type: integer }
        created_at: { type: string, format: date-time }
    GovKPIs:
      type: object
      description: All sections nullable; a failed rollup is null + named in degraded.
      properties:
        revenue_30d_minor: { type: integer, nullable: true }
        settled_payments_30d: { type: integer, nullable: true }
        ridership_estimate_30d: { type: integer, nullable: true, description: One settled fare ≈ one ride }
        kg_co2_avoided_total: { type: number, nullable: true }
        carbon_credits_total: { type: number, nullable: true }
        vehicles_total: { type: integer, nullable: true }
        vehicles_active: { type: integer, nullable: true }
        fleet_active_ratio_pct: { type: number, nullable: true, description: Static status mix (active/total), NOT time-based uptime }
        fleet_uptime_pct: { type: number, nullable: true, description: Null until a time-based availability source exists }
        fleet_uptime_note: { type: string }
        stations_available_kg: { type: number, nullable: true }
        open_incidents: { type: integer, nullable: true, description: open + acknowledged + in_progress }
        partial: { type: boolean }
        degraded:
          type: array
          items: { type: string }
    LoyaltyBalance:
      type: object
      properties:
        rider_sub: { type: string }
        points: { type: integer }
        updated_at: { type: string, format: date-time }
    Redemption:
      type: object
      properties:
        redemption_id: { type: string, format: uuid }
        redeemed_offer_id: { type: string, format: uuid }
        points_spent: { type: integer }
        idempotency_key: { type: string }
        status: { type: string }
        remaining_points: { type: integer, description: Omitted on idempotent replays }
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    JsonOk:
      description: Successful JSON response
      content:
        application/json:
          schema: { type: object }
    HealthOk:
      description: Service healthy
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Health' }
    HealthDegraded:
      description: Postgres unreachable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Health' }
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacking the required role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ModuleDisabled:
      description: The module toggle for this route is OFF (SPEC §3.2)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
