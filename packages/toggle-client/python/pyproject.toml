[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h2fleet-toggle-client"
version = "0.1.0"
description = "H2Fleet feature-toggle client SDK (Python). Same contract as the Go/TS SDKs: is_enabled(module) with 5s local cache, fail-closed."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["toggle_client*"]
