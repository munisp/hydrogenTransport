      payload: { $ref: "./schemas/maintenance.predicted.json" }
    FuelReading:
      name: FuelReading
      title: fuel.reading
      contentType: application/json
      payload: { $ref: "./schemas/fuel.reading.json" }
    SafetyLeakDetected:
      name: SafetyLeakDetected
      title: safety.leak.detected
      contentType: application/json
      payload: { $ref: "./schemas/safety.leak.detected.json" }
    DispatchJobAssigned:
      name: DispatchJobAssigned
      title: dispatch.job.assigned
      contentType: application/json
      payload: { $ref: "./schemas/dispatch.job.assigned.json" }
    DrtRequested:
      name: DrtRequested
      title: drt.requested
      contentType: application/json
      payload: { $ref: "./schemas/drt.requested.json" }
    FarePaymentInitiated:
      name: FarePaymentInitiated
      title: fare.payment.initiated
      contentType: application/json
      payload: { $ref: "./schemas/fare.payment.initiated.json" }
    FarePaymentSettled:
      name: FarePaymentSettled
      title: fare.payment.settled
